dependencies { api project(':core') }

tasks.register('runPlanningLiveBenchmark', JavaExec) {
    workingDir rootProject.projectDir
    group = 'verification'
    description = 'Separately invoked held-out planning quality/latency on the existing shared local backend.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.PlanningLiveBenchmark'
}

tasks.register('runGenerationLiveSmoke', JavaExec) {
    group = 'verification'
    description = 'Explicit live local Ollama structured candidate smoke (not a JUnit fake).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.GenerationLiveSmoke'
}

tasks.register('runNeedleLiveSmoke', JavaExec) {
    group = 'verification'
    description = 'Explicit pinned actual local Needle held-out extraction benchmark.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.NeedleLiveSmoke'
}

tasks.register('runD01LanguageLiveProbe', JavaExec) {
    workingDir rootProject.projectDir
    group = 'verification'
    description = 'Actual pinned Needle evidence for the frozen D01 and independent oak-delivery paraphrases.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.D01LanguageLiveProbe'
}


tasks.register('runD02LanguageLiveProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.D02LanguageLiveProbe'
    workingDir rootProject.projectDir
}

tasks.register('runD03LanguageLiveProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.D03LanguageLiveProbe'
    workingDir rootProject.projectDir
}

tasks.register('runD04LanguageLiveProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.D04LanguageLiveProbe'
    workingDir rootProject.projectDir
}
