dependencies { api project(':core') }

tasks.register('runPlanningLiveBenchmark', JavaExec) {
    workingDir rootProject.projectDir
    group = 'verification'
    description = 'Separately invoked held-out planning quality/latency on the existing shared local backend.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.PlanningLiveBenchmark'
}

tasks.register('runGenerationLiveSmoke', JavaExec) {
    group = 'verification'
    description = 'Explicit live local Ollama structured candidate smoke (not a JUnit fake).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.GenerationLiveSmoke'
}

tasks.register('runNeedleLiveSmoke', JavaExec) {
    group = 'verification'
    description = 'Explicit pinned actual local Needle held-out extraction benchmark.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.aivillages.providers.NeedleLiveSmoke'
}
