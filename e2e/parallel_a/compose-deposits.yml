services:
  minecraft:
    cpuset: '0-1'
    environment:
      COGNITIVECRAFT_DEPOSIT_EVIDENCE: '${A05_DEPOSIT_ENABLED:-false}'
      COGNITIVECRAFT_RESOURCE_RECEIPT_PREFIX: '${A06_RECEIPT_PREFIX_ENABLED:-false}'
      COGNITIVECRAFT_HARVEST_EVIDENCE: '${A06_HARVEST_ENABLED:-false}'
      COGNITIVECRAFT_PICKUP_EVIDENCE: '${A06_PICKUP_ENABLED:-false}'
      COGNITIVECRAFT_A06_HARVEST_PROBE: '${A06_HARVEST_ENABLED:-false}'
      COGNITIVECRAFT_ACTIVITY_VIEW: 'true'
      COGNITIVECRAFT_A05_PROBE: 'true'
      JAVA_TOOL_OPTIONS: '${A06_NATIVE_JAVA_TOOL_OPTIONS:-}'
  client-a:
    cpuset: '2'
  client-b:
    cpuset: '3'
