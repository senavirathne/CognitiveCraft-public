// Plain compilation against the official unobfuscated server is an alternative
// for containers where Loom cannot probe Unix-domain sockets.
def headless = project.hasProperty('serverJar')
if (!headless) apply plugin: 'net.fabricmc.fabric-loom'
base { archivesName = 'ai-villages' }
dependencies {
    if (headless) {
        compileOnly files(project.property('serverJar'))
        compileOnly fileTree(dir: project.property('serverLibraries'), include: '*.jar')
        testImplementation files(project.property('serverJar'))
        testImplementation fileTree(dir: project.property('serverLibraries'), include: '*.jar')
    } else {
        minecraft 'com.mojang:minecraft:26.3'
        implementation 'net.fabricmc:fabric-loader:0.19.5'
        implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    }
    implementation project(':core')
    implementation project(':providers')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar {
    dependsOn ':core:classes', ':providers:classes'
    from project(':core').sourceSets.main.output
    from project(':providers').sourceSets.main.output
}

// A separate test mod; these classes are never included in the release JAR.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        // The test mod launches through Loom and needs the main runtime dependencies,
        // including the development launch injector, in addition to its own output.
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}
if (!headless) {
    dependencies { gameTestImplementation 'net.fabricmc.fabric-api:fabric-gametest-api-v1:4.0.32+3434d6d95d' }
    loom {
        mods {
            ai_villages { sourceSet sourceSets.main }
            ai_villages_tests { sourceSet sourceSets.gameTest }
        }
        runs {
            gameTest {
                server()
                name 'AI Villages GameTest'
                source sourceSets.gameTest
                vmArg '-Dfabric-api.gametest'
                // Fabric's XML reporter creates the parent directory; keep an explicit parent.
                vmArg '-Dfabric-api.gametest.report-file=./gametest-results.xml'
                runDir 'build/gametest-run'
            }
        }
    }
}
tasks.register('gameTestJar', Jar) {
    dependsOn gameTestClasses
    archiveClassifier = 'gametest'
    from sourceSets.gameTest.output
}
