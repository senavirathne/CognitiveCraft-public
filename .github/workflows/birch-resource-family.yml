name: RB-007 exact birch resource family acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['core/**','providers/**','fabric/**','e2e/**','scripts/**','.github/workflows/birch-resource-family.yml','.github/implementation/RB-007*']
  push:
    branches: [main,rb-007-birch-resource-family]
    paths: ['core/**','providers/**','fabric/**','e2e/**','scripts/**','.github/workflows/birch-resource-family.yml','.github/implementation/RB-007*']
permissions:
  contents: read
concurrency:
  group: rb007-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  owners-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: '-Dcognitivecraft.gametest.trace=true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: All modules and native compilation
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:gameTestClasses :fabric:build :fabric:gameTestJar
          python3 scripts/verify-rb007.py junit
          python3 scripts/verify-rb007.py identity
      - name: Select actual survival placement effects
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');v=json.loads(p.read_text());v['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.BirchLogEffectGameTests'];p.write_text(json.dumps(v,indent=2)+'\n')
          PY
      - name: Actual birch timed loot, components and species isolation
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-rb007.py native --phase effects --class-name birch_log_effect_game_tests --marker RB007_LOG_EFFECTS
          mv fabric/build/gametest-run fabric/build/rb007-effects-run
      - name: Select installed birch recipe and physical custody fixture
        run: |
          python3 - <<'PYSELECT'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');v=json.loads(p.read_text());v['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.BirchPlankEffectGameTests'];p.write_text(json.dumps(v,indent=2)+'\n')
          PYSELECT
      - name: Actual installed birch recipe, surplus, cancellation and reload
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-rb007.py native --phase plank-effects --class-name birch_plank_effect_game_tests --marker RB007_PLANK_EFFECTS
          mv fabric/build/gametest-run fabric/build/rb007-plank-effects-run
      - name: Select independent admission and facility graph fixture
        run: |
          python3 - <<'PYSEL'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');v=json.loads(p.read_text());v['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.BirchKernelGameTests'];p.write_text(json.dumps(v,indent=2)+'\n')
          PYSEL
      - name: Controlled separate admissions and exact birch shortfall graphs
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-rb007.py native --phase controlled --class-name birch_kernel_game_tests --marker 'RB007_NATIVE phase=cold genuine=false'
          mv fabric/build/gametest-run fabric/build/rb007-controlled-run
      - name: Start pinned configured generation backend
        timeout-minutes: 12
        run: |
          docker run --detach --name cognitivecraft-rb007-ollama --publish 127.0.0.1:11434:11434 ollama/ollama:0.12.10
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:11434/api/version && break; sleep 2; done
          docker exec cognitivecraft-rb007-ollama ollama pull qwen3:4b-instruct-2507-q4_K_M
          curl --fail --silent http://127.0.0.1:11434/api/tags > build/rb007-evidence/models.json
          curl --fail --silent --show-error http://127.0.0.1:11434/api/generate --header 'Content-Type: application/json' --data '{"model":"qwen3:4b-instruct-2507-q4_K_M","stream":false,"keep_alive":"30m"}' | python3 -c 'import json,sys; assert json.load(sys.stdin)["done"]'
      - name: Genuine separate birch admissions and physical shortfall graphs
        timeout-minutes: 25
        env:
          COGNITIVECRAFT_OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
          COGNITIVECRAFT_RB007_GENUINE: 'true'
          COGNITIVECRAFT_RB007_PHASE: cold
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-rb007.py native --phase genuine-cold --class-name birch_kernel_game_tests --marker 'RB007_NATIVE phase=cold genuine=true'
      - name: Stop actual backend and prove endpoint unavailable
        run: |
          docker stop cognitivecraft-rb007-ollama
          test "$(docker inspect --format='{{.State.Running}}' cognitivecraft-rb007-ollama)" = false
          if curl --silent --max-time 2 http://127.0.0.1:11434/api/version >/dev/null; then exit 1; fi
      - name: Fresh citizen and both birch methods in a new JVM on the same save
        env:
          COGNITIVECRAFT_RB007_GENUINE: 'true'
          COGNITIVECRAFT_RB007_PHASE: warm
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-rb007.py native --phase genuine-warm --class-name birch_kernel_game_tests --marker 'RB007_NATIVE phase=warm genuine=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb007-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            build/rb007-evidence/
            fabric/build/rb007-effects-run/
            fabric/build/rb007-plank-effects-run/
            fabric/build/rb007-controlled-run/
            fabric/build/gametest-run/
            fabric/build/libs/

  connected-client:
    name: GP-RB-07 genuine birch methods, Jobs, two principals and abrupt restart
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Production binary and existing harness regressions
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:build
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 scripts/verify-rb007.py identity
      - name: Acquire existing pinned Needle test backend
        run: python3 tools/needle/install.py build/needle
      - name: Actual connected birch learning, language, shortfall Jobs and saved custody
        run: |
          python3 e2e/suite.py --profile rb007 --root build/e2e/rb007
          python3 scripts/verify-rb007.py client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb007-connected-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/rb007-evidence/
            build/e2e/rb007/
            build/e2e-sdk/integrity.json
            fabric/build/libs/ai-villages-0.1.0.jar
