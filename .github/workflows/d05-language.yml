name: D05 crafting-table interpretation evidence
on:
  push:
    branches: [fix/nlu-planning-reliability]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d05-language-${{ github.ref }}
  cancel-in-progress: false
jobs:
  interpretation:
    name: Unit regressions and actual pinned Needle production measurement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Preserve all core and provider regressions
        run: bash gradlew --no-daemon --stacktrace :core:test :providers:test :providers:testClasses
      - name: Install immutable actual interpreter assets
        run: python3 tools/needle/install.py build/needle
      - name: Measure original D05 before the common production correction
        env:
          COGNITIVECRAFT_NEEDLE_DIR: ${{ github.workspace }}/build/needle
        run: bash gradlew --no-daemon --stacktrace :providers:runD05LanguageLiveProbe --args=baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d05-interpretation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/d05-evidence/
            build/needle/manifest.json
            core/build/test-results/test/
            providers/build/test-results/test/
