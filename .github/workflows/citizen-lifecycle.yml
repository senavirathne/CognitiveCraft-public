name: Citizen lifecycle reconciliation acceptance
on:
  push:
    branches: [main, work/imp-029]
    paths: ['core/**', 'fabric/**', 'scripts/**', '.github/workflows/citizen-lifecycle.yml']
  pull_request:
    paths: ['core/**', 'fabric/**', 'scripts/**', '.github/workflows/citizen-lifecycle.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citizen-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retire only superseded IMP-029 review runs
        if: >-
          github.repository == 'senavirathne/CognitiveCraft-public' &&
          (github.head_ref == 'work/imp-029' || github.ref == 'refs/heads/work/imp-029') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          REPO = 'senavirathne/CognitiveCraft-public'
          BRANCH = 'work/imp-029'
          HEAD = os.environ['REVIEW_HEAD']
          OLD_HEADS = {
              '0d620ec4d07715c368300b7e213751cff3a00f59',
              '5fb2f62d8c47abcebe9ff043106164b319051361',
              '69b1a52c5645a0030506227f5cd848c61f196092',
              '98cf1bf8ff75b6f993c95a89211647fbf963e5c1',
              'c410a53a1435fc3c341cfc8a72b3dead3eea1a36',
              'ae0ea7cb8268b5921fc3fd17633e1574fd9b19a8',
              'c30206bdc9a5e9aa0a36169197d023e051ab2c8c',
              'baf57ba4a4a98901802a1ba67e3144f38a2a0fd1',
          }
          def target(run):
              return (run.get('head_sha') in OLD_HEADS and run['head_sha'] != HEAD
                      and run.get('head_branch') == BRANCH
                      and (run.get('head_repository') or {}).get('full_name') == REPO
                      and run.get('status') in {'queued','pending','requested','waiting','in_progress'}
                      and run.get('event') in {'push','pull_request','workflow_dispatch'})
          def api(path, method='GET'):
              request = urllib.request.Request('https://api.github.com/repos/'+REPO+path,
                  method=method, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  body=response.read()
                  return json.loads(body) if body else None
          def current():
              return api('/git/ref/heads/'+BRANCH)['object']['sha'] == HEAD
          if not current():
              raise SystemExit('Review branch advanced; no cancellations performed')
          deadline=time.monotonic()+150
          cancelled=0
          for page in range(1,7):
              query=urllib.parse.urlencode({'branch':BRANCH,'per_page':100,'page':page})
              runs=api('/actions/runs?'+query)['workflow_runs']
              for run in runs:
                  if not target(run): continue
                  if cancelled>=100 or time.monotonic()>=deadline or not current():
                      raise SystemExit('Bound reached or review head changed; cleanup stopped')
                  try:
                      api('/actions/runs/'+str(run['id'])+'/cancel','POST')
                      cancelled+=1
                      print('Cancelled superseded review run',run['id'],run['head_sha'])
                  except urllib.error.HTTPError as error:
                      if error.code != 409: raise
              if len(runs)<100: break
          print('Superseded IMP-029 runs cancelled:',cancelled)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: All affected modules and production build
        run: bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build
      - name: Actual event mapping and physical partial loss in separate saved-world JVMs
        run: python3 scripts/verify-lifecycle.py
      - name: Require executed lifecycle matrices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for suite, minimum in [('CitizenLifecycleTest',26),('CitizenLifecycleStorageTest',9),('CitizenWorkReconcilerTest',3)]:
              cases=list(ET.parse(Path('core/build/test-results/test')/('TEST-dev.aivillages.core.kernel.'+suite+'.xml')).getroot().iter('testcase'))
              if len(cases)<minimum or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
                  raise SystemExit('Missing passing lifecycle matrix '+suite)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citizen-lifecycle-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            build/lifecycle-evidence/
            build/lifecycle-run/
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
