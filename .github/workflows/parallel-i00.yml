name: I00 activity runtime and production
on:
  push:
    branches: [integration/activity-runtime-production]
    paths:
      - .github/workflows/parallel-i00.yml
      - .github/i00-candidate.json
permissions:
  contents: read
  actions: read
concurrency:
  group: cognitivecraft-i00-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      production_sha256: ${{ steps.bundle.outputs.production_sha256 }}
      source_tree: ${{ steps.bundle.outputs.source_tree }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Verify frozen parents and build production and test JARs once
        run: |
          python3 -c 'from e2e.parallel_i00.bundle import identity; print(identity())'
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_a -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_i00 -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/crafting -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/world -p 'test_*.py'
          python3 e2e/parallel_b/campaign_contracts.py verify
      - name: Prepare official Minecraft and compile isolated instruments
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          mkdir -p build/i00-instruments/{a,b}
          python3 e2e/parallel_a/prepare.py
          cp build/e2e-driver/observer.jar build/i00-instruments/a/observer.jar
          cp build/e2e-driver/observer-baseline.jar build/e2e-driver/observer.jar
          python3 scripts/campaign-crafting/prepare.py
          python3 e2e/parallel_b/prepare_diagnostics.py
          cp build/e2e-driver/observer.jar build/i00-instruments/b/observer.jar
          python3 tools/needle/install.py build/needle
      - name: Bind all binary, instrument and module evidence to this event
        id: bundle
        run: python3 -m e2e.parallel_i00.bundle export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/i00-bundle.json
            build/e2e-driver/client.jar
            build/e2e-sdk/integrity.json
            build/i00-instruments/
            build/parallel-a/observer-adaptation.json
            build/b-diagnostics/integrity.json
            build/campaign-crafting-oracle/integrity.json
            build/needle/
            fabric/build/libs/ai-villages-0.1.0.jar
            fabric/build/libs/ai-villages-0.1.0-gametest.jar
            core/build/test-results/test/TEST-*.xml
            providers/build/test-results/test/TEST-*.xml
            fabric/build/test-results/test/TEST-*.xml

  smoke:
    name: Connected native Docker bootstrap
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact candidate and start real server and clients
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer a
          python3 e2e/runtime.py prepare
          docker version
          docker compose version
          python3 e2e/suite.py --profile smoke --topology compose --root build/e2e/i00/bootstrap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-bootstrap-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: build/e2e/i00/bootstrap/

  b-compatibility:
    name: Native B recipe, saved reuse and interference regressions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      B_ROOT: build/e2e/i00/b-compatibility
      COGNITIVECRAFT_B_QUALIFICATION_PROJECT: cc-i00-b-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the one candidate and prepare the real Minecraft SDK
        id: prepare
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer b
          python3 e2e/runtime.py prepare
      - name: Native host recipe, production, placement and bread regressions
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/run_hosts.py --root "$B_ROOT/hosts" --built \
            --entrypoint dev.aivillages.fabric.GeneralizedRecipeChoiceGameTests \
            --entrypoint dev.aivillages.fabric.ConcretePlankChoiceGameTests \
            --entrypoint dev.aivillages.fabric.PlanningChoiceHostGameTests \
            --entrypoint dev.aivillages.fabric.BirchPlankEffectGameTests \
            --entrypoint dev.aivillages.fabric.OakPlankEffectGameTests \
            --entrypoint dev.aivillages.fabric.StickEffectGameTests \
            --entrypoint dev.aivillages.fabric.AxeEffectGameTests \
            --entrypoint dev.aivillages.fabric.TableEffectGameTests \
            --entrypoint dev.aivillages.fabric.PlacementEffectGameTests \
            --entrypoint dev.aivillages.fabric.ParallelBLegacyBreadGameTests \
            --entrypoint dev.aivillages.fabric.OakLogEffectGameTests \
            --entrypoint dev.aivillages.fabric.BirchLogEffectGameTests
      - name: Exact quantity and capacity controls with a connected Minecraft client
        id: quantities
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/quantity_native.py --integration --root "$B_ROOT/quantity"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/quantity"
      - name: Same-JAR, same-world method reuse, native hard kill and corrupt evidence controls
        if: ${{ !cancelled() && steps.quantities.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/native_qualification.py --integration --root "$B_ROOT/harness" --seed-root "$B_ROOT/quantity"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/harness"
          python3 -m e2e.parallel_i00.adversarial audit-observer --root "$B_ROOT/harness" --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" --out "$B_ROOT/harness/adversarial-review.json"
      - name: Native 22-case legacy diagnostics and independent replay
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/diagnostics.py --root "$B_ROOT/diagnostics"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/diagnostics"
          python3 e2e/parallel_b/verify_diagnostics.py "$B_ROOT/diagnostics" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" e2e/parallel_b/diagnostic-matrix.json
      - name: Real second client, strict mutation window and shared/private method reuse
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/interference_native.py --root "$B_ROOT/interference"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/interference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-b-compatibility-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: build/e2e/i00/b-compatibility/

  regression-ci:
    uses: ./.github/workflows/ci.yml

  regression-accomplishment-evidence:
    uses: ./.github/workflows/accomplishment-evidence.yml

  regression-knowledge-apprenticeship:
    uses: ./.github/workflows/knowledge-apprenticeship.yml

  regression-primitive-diagnostics:
    uses: ./.github/workflows/primitive-diagnostics.yml

  regression-goal-planning:
    uses: ./.github/workflows/goal-planning.yml

  regression-observed-knowledge:
    uses: ./.github/workflows/observed-knowledge.yml

  regression-world-retention:
    uses: ./.github/workflows/world-retention.yml

  regression-save-compatibility:
    uses: ./.github/workflows/save-compatibility.yml

  regression-blueprint-boundary:
    uses: ./.github/workflows/blueprint-boundary.yml

  regression-prerequisites:
    uses: ./.github/workflows/prerequisites.yml

  a-recovery:
    name: Exact legacy A runtime regression ${{ matrix.profile }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        profile: [A00, A01, A02, A03, A04, A05, A06, A07, A08, A09]
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      I00_PROFILE: ${{ matrix.profile }}
      JAVA_TOOL_OPTIONS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact integration binary and pinned stopped admission input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer a
          python3 e2e/runtime.py prepare
          mkdir -p build/i00-fixtures
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/13311090608/zip > build/i00-fixtures/three-admissions.zip
          echo '8e3a030c078d0e1423b4342eae5105eed27c2e848619390a2f40e231a22d8ae8  build/i00-fixtures/three-admissions.zip' | sha256sum --check
      - name: Run the original native profile on this candidate
        id: native
        run: |
          python3 -m e2e.parallel_i00.recovery run --profile "$I00_PROFILE" \
            --root "build/e2e/i00/recovery/$I00_PROFILE" --source "$GITHUB_SHA" \
            --jar-sha256 "$I00_JAR_SHA256" --seed-archive build/i00-fixtures/three-admissions.zip
      - name: Independently inspect the complete original native evidence in Docker
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: |
          docker pull python:3.12-slim
          output="$PWD/build/e2e/i00/recovery/$I00_PROFILE"
          mkdir -p "$output"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 -e GITHUB_SHA -e GITHUB_REF -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -v "$PWD:$PWD:ro" -v "$output:$output:rw" -w "$PWD" python:3.12-slim \
            python3 -m e2e.parallel_i00.recovery review --profile "$I00_PROFILE" --root "$output" \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" --out "$output"
      - name: Preserve original native bytes and independent verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i00-a-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: build/e2e/i00/recovery/${{ matrix.profile }}/
