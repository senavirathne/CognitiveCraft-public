name: I00 activity runtime and production
on:
  push:
    branches: [integration/activity-runtime-production]
    paths:
      - .github/workflows/parallel-i00.yml
      - .github/i00-candidate.json
permissions:
  contents: read
  actions: read
concurrency:
  group: cognitivecraft-i00-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      production_sha256: ${{ steps.bundle.outputs.production_sha256 }}
      source_tree: ${{ steps.bundle.outputs.source_tree }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Select full qualification only on a designated integration candidate
        id: scope
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          control = Path('.github/i00-candidate.json')
          value = json.loads(control.read_text()) if control.is_file() else {'qualification': False}
          if set(value) != {'qualification'} or type(value['qualification']) is not bool:
              raise ValueError('Qualification switch must be a single Boolean')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              print(f"full={str(value['qualification']).lower()}", file=output)
          PYCODE
      - name: Verify frozen parents and build production and test JARs once
        run: |
          python3 -c 'from e2e.parallel_i00.bundle import identity; print(identity())'
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_a -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_i00 -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/crafting -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/world -p 'test_*.py'
          python3 e2e/parallel_b/campaign_contracts.py verify
      - name: Prepare official Minecraft and compile isolated instruments
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          mkdir -p build/i00-instruments/{a,b,endurance,joint}
          python3 e2e/parallel_a/prepare.py
          cp build/e2e-driver/observer.jar build/i00-instruments/a/observer.jar
          python3 -m e2e.parallel_i00.endurance_prepare
          cp build/e2e-driver/observer.jar build/i00-instruments/endurance/observer.jar
          cp build/e2e-driver/observer-baseline.jar build/e2e-driver/observer.jar
          python3 scripts/campaign-crafting/prepare.py
          python3 e2e/parallel_b/prepare_diagnostics.py
          cp build/e2e-driver/observer.jar build/i00-instruments/b/observer.jar
          python3 e2e/parallel_b/prepare_diagnostics.py --i00-fixtures
          cp build/e2e-driver/observer.jar build/i00-instruments/joint/observer.jar
          python3 tools/needle/install.py build/needle
      - name: Bind all binary, instrument and module evidence to this event
        id: bundle
        run: python3 -m e2e.parallel_i00.bundle export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/i00-bundle.json
            build/e2e-driver/client.jar
            build/e2e-sdk/integrity.json
            build/i00-instruments/
            build/parallel-i00/endurance-observer/integrity.json
            build/parallel-a/observer-adaptation.json
            build/b-diagnostics/integrity.json
            build/i00-recipe-fixtures/integrity.json
            build/campaign-crafting-oracle/integrity.json
            build/needle/
            fabric/build/libs/ai-villages-0.1.0.jar
            fabric/build/libs/ai-villages-0.1.0-gametest.jar
            core/build/test-results/test/TEST-*.xml
            providers/build/test-results/test/TEST-*.xml
            fabric/build/test-results/test/TEST-*.xml

  smoke:
    name: Connected native Docker bootstrap
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact candidate and start real server and clients
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer a
          python3 e2e/runtime.py prepare
          docker version
          docker compose version
          python3 e2e/suite.py --profile smoke --topology compose --root build/e2e/i00/bootstrap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-bootstrap-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: build/e2e/i00/bootstrap/

  fixed-wheat:
    name: Native fixed-stock wheat with original 32-block allowance
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      WHEAT_ROOT: build/e2e/i00/fixed-wheat
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the exact candidate and prepare Minecraft and its connected client
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer a
          python3 e2e/runtime.py prepare
      - name: Admit a real wheat method and replay three units under the original travel allowance
        id: native-wheat
        run: python3 -m e2e.parallel_i00.fixed_wheat run --root "$WHEAT_ROOT"
      - name: Independently verify the original request, native custody and allowance
        if: ${{ !cancelled() && steps.native-wheat.outcome != 'skipped' }}
        run: |
          python3 -m e2e.parallel_i00.fixed_wheat review --root "$WHEAT_ROOT" \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-review-fixed-wheat-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: build/e2e/i00/fixed-wheat/review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-fixed-wheat-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: build/e2e/i00/fixed-wheat/

  b-compatibility:
    name: Native B recipe, saved reuse and interference regressions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      B_ROOT: build/e2e/i00/b-compatibility
      COGNITIVECRAFT_B_QUALIFICATION_PROJECT: cc-i00-b-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the one candidate and prepare the real Minecraft SDK
        id: prepare
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer b
          python3 e2e/runtime.py prepare
      - name: Native host recipe, production, placement and bread regressions
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/run_hosts.py --root "$B_ROOT/hosts" --built \
            --entrypoint dev.aivillages.fabric.GeneralizedRecipeChoiceGameTests \
            --entrypoint dev.aivillages.fabric.ConcretePlankChoiceGameTests \
            --entrypoint dev.aivillages.fabric.PlankVariantGameTests \
            --entrypoint dev.aivillages.fabric.PlanningChoiceHostGameTests \
            --entrypoint dev.aivillages.fabric.BirchPlankEffectGameTests \
            --entrypoint dev.aivillages.fabric.OakPlankEffectGameTests \
            --entrypoint dev.aivillages.fabric.StickEffectGameTests \
            --entrypoint dev.aivillages.fabric.AxeEffectGameTests \
            --entrypoint dev.aivillages.fabric.TableEffectGameTests \
            --entrypoint dev.aivillages.fabric.PlacementEffectGameTests \
            --entrypoint dev.aivillages.fabric.ParallelBLegacyBreadGameTests \
            --entrypoint dev.aivillages.fabric.OakLogEffectGameTests \
            --entrypoint dev.aivillages.fabric.BirchLogEffectGameTests
      - name: Exact quantity and capacity controls with a connected Minecraft client
        id: quantities
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/quantity_native.py --integration --root "$B_ROOT/quantity"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/quantity"
      - name: Same-JAR, same-world method reuse, native hard kill and corrupt evidence controls
        if: ${{ !cancelled() && steps.quantities.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/native_qualification.py --integration --root "$B_ROOT/harness" --seed-root "$B_ROOT/quantity"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/harness"
          python3 -m e2e.parallel_i00.adversarial audit-observer --root "$B_ROOT/harness" --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" --out "$B_ROOT/harness/adversarial-review.json"
      - name: Native 22-case legacy diagnostics and independent replay
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/diagnostics.py --root "$B_ROOT/diagnostics"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/diagnostics"
          python3 e2e/parallel_b/verify_diagnostics.py "$B_ROOT/diagnostics" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" e2e/parallel_b/diagnostic-matrix.json
      - name: Real second client, strict mutation window and shared/private method reuse
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python3 e2e/parallel_b/interference_native.py --root "$B_ROOT/interference"
          python3 e2e/parallel_b/native_audit.py --root "$B_ROOT/interference"
      - name: Exercise and independently review integrated custody and saved continuation
        if: ${{ !cancelled() && needs.build.outputs.full == 'true' && steps.quantities.outcome == 'success' }}
        run: |
          result=0
          root=build/e2e/i00/integrated-controls
          python3 -m e2e.parallel_i00.integrated_controls run --root "$root" --seed-root "$B_ROOT/quantity" \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" || result=$?
          python3 -m e2e.parallel_i00.integrated_controls review --root "$root" --out "$root/review.json" \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" || result=1
          exit "$result"
      - name: Exercise genuine all-family admission and cold reuse
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          result=0
          root=build/e2e/i00/variant-admission
          python3 -m e2e.parallel_i00.variant_admission run --root "$root" || result=$?
          python3 -m e2e.parallel_i00.variant_admission review --root "$root" \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" || result=1
          exit "$result"
      - name: Preserve independent compatibility reviews
        if: ${{ !cancelled() && needs.build.outputs.full == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: i00-review-b-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/e2e/i00/b-compatibility/harness/adversarial-review.json
            build/e2e/i00/integrated-controls/review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-b-compatibility-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            build/e2e/i00/b-compatibility/
            build/e2e/i00/variant-admission/
            build/e2e/i00/integrated-controls/

      - name: Preserve compact failure diagnostics alongside the complete raw archive
        if: ${{ always() }}
        run: python3 -m e2e.parallel_i00.diagnostics --root "build/e2e/i00" --out "build/i00-diagnostics/b"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: i00-diagnostics-b-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: build/i00-diagnostics/b/

  regression-ci:
    uses: ./.github/workflows/ci.yml

  regression-accomplishment-evidence:
    uses: ./.github/workflows/accomplishment-evidence.yml

  regression-knowledge-apprenticeship:
    uses: ./.github/workflows/knowledge-apprenticeship.yml

  regression-primitive-diagnostics:
    uses: ./.github/workflows/primitive-diagnostics.yml

  regression-goal-planning:
    uses: ./.github/workflows/goal-planning.yml

  regression-observed-knowledge:
    uses: ./.github/workflows/observed-knowledge.yml

  regression-world-retention:
    uses: ./.github/workflows/world-retention.yml

  regression-save-compatibility:
    uses: ./.github/workflows/save-compatibility.yml

  regression-blueprint-boundary:
    uses: ./.github/workflows/blueprint-boundary.yml

  regression-prerequisites:
    uses: ./.github/workflows/prerequisites.yml

  a-recovery:
    name: Exact legacy A runtime regression ${{ matrix.profile }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        profile: [A00, A01, A02, A03, A04, A05, A06, A07, A08, A09]
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      I00_PROFILE: ${{ matrix.profile }}
      JAVA_TOOL_OPTIONS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact integration binary and pinned stopped admission input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer a
          python3 e2e/runtime.py prepare
          mkdir -p build/i00-fixtures
          python3 -m e2e.parallel_i00.pinned_fixture --out build/i00-fixtures/three-admissions.zip
          echo '8e3a030c078d0e1423b4342eae5105eed27c2e848619390a2f40e231a22d8ae8  build/i00-fixtures/three-admissions.zip' | sha256sum --check
      - name: Run the original native profile on this candidate
        id: native
        run: |
          python3 -m e2e.parallel_i00.recovery run --profile "$I00_PROFILE" \
            --root "build/e2e/i00/recovery/$I00_PROFILE" --source "$GITHUB_SHA" \
            --jar-sha256 "$I00_JAR_SHA256" --seed-archive build/i00-fixtures/three-admissions.zip
      - name: Independently inspect the complete original native evidence in Docker
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: |
          docker pull python:3.12
          output="$PWD/build/e2e/i00/recovery/$I00_PROFILE"
          mkdir -p "$output"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 -e GITHUB_SHA -e GITHUB_REF -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -v "$PWD:$PWD:ro" -v "$output:$output:rw" -w "$PWD" python:3.12 \
            python3 -m e2e.parallel_i00.recovery review --profile "$I00_PROFILE" --root "$output" \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" --out "$output"
      - name: Preserve original native bytes and independent verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i00-a-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: build/e2e/i00/recovery/${{ matrix.profile }}/
      - name: Retain the compact independent profile review
        if: ${{ !cancelled() && needs.build.outputs.full == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: i00-review-a-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: build/e2e/i00/recovery/${{ matrix.profile }}/review.json

      - name: Preserve compact failure diagnostics alongside the complete raw archive
        if: ${{ always() }}
        run: python3 -m e2e.parallel_i00.diagnostics --root "build/e2e/i00/recovery/${{ matrix.profile }}" --out "build/i00-diagnostics/a-${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: i00-diagnostics-a-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: build/i00-diagnostics/a-${{ matrix.profile }}/

  walkthrough:
    name: Decisive player goal ${{ matrix.cohort }}
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        cohort: [live, saved-online, saved-offline, unsaved]
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      I00_COHORT: ${{ matrix.cohort }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the matching binary and prepare the real Minecraft SDK
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer joint
          python3 e2e/runtime.py prepare
      - name: Exercise the ordinary player goal in Minecraft Docker
        id: native-walkthrough
        run: python3 -m e2e.parallel_i00.walkthrough --root "build/e2e/i00/walkthrough/$I00_COHORT" --cohort "$I00_COHORT"
      - name: Independently check the saved prelude and original player-goal witnesses
        if: ${{ !cancelled() && steps.native-walkthrough.outcome != 'skipped' }}
        run: |
          root="build/e2e/i00/walkthrough/$I00_COHORT"
          python3 -m e2e.parallel_i00.walkthrough_review --root "$root" --cohort "$I00_COHORT" \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256"
      - name: Independently check original child allocation and conflicting custody
        if: ${{ !cancelled() && matrix.cohort == 'live' && steps.native-walkthrough.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          python3 -m e2e.parallel_i00.joint_controls --root build/e2e/i00/walkthrough/live/joint \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-walkthrough-${{ matrix.cohort }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: build/e2e/i00/walkthrough/${{ matrix.cohort }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-review-walkthrough-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/e2e/i00/walkthrough/${{ matrix.cohort }}/review.json
            build/e2e/i00/walkthrough/${{ matrix.cohort }}/joint/joint-review.json

      - name: Preserve compact failure diagnostics alongside the complete raw archive
        if: ${{ always() }}
        run: python3 -m e2e.parallel_i00.diagnostics --root "build/e2e/i00/walkthrough/${{ matrix.cohort }}" --out "build/i00-diagnostics/walkthrough-${{ matrix.cohort }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: i00-diagnostics-walkthrough-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: build/i00-diagnostics/walkthrough-${{ matrix.cohort }}/
      - name: Preserve the stopped admission world for exact failure reproduction
        if: ${{ !cancelled() && matrix.cohort == 'live' }}
        uses: actions/upload-artifact@v4
        with:
          name: i00-walkthrough-seed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/e2e/i00/walkthrough/live/seed/metadata.json
            build/e2e/i00/walkthrough/live/seed/walkthrough-seed.json
            build/e2e/i00/walkthrough/live/seed/admissions.json
            build/e2e/i00/walkthrough/live/seed/server/game/world/

  coverage:
    name: Native I00 coverage ${{ matrix.track }}
    needs: [build, walkthrough]
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        track: [original-0, original-1, original-2, original-3, original-4, original-5, held-out, endurance,
                recipe-withdraw, recipe-craft, recipe-deposit, table-withdraw, table-place]
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      I00_TRACK: ${{ matrix.track }}
      I00_SHARDS: '6'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact build identity and prepare the real Minecraft SDK
        id: prepare
        run: |
          observer=b
          case "$I00_TRACK" in
            endurance) observer=endurance ;;
            recipe-*|table-*) observer=joint ;;
          esac
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer "$observer"
          python3 e2e/runtime.py prepare
          case "$I00_TRACK" in
            original-*) root="build/e2e/i00/campaign/${I00_TRACK#original-}" ;;
            *) root="build/e2e/i00/$I00_TRACK" ;;
          esac
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Exercise and independently review the frozen cases and their separate material controls
        env:
          I00_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          result=0
          case "$I00_TRACK" in
            original-*)
              python3 -m e2e.parallel_i00.campaign run --root "$I00_ROOT" \
                --shard-index "${I00_TRACK#original-}" --shard-count "$I00_SHARDS" || result=$?
              python3 -m e2e.parallel_i00.campaign review --root "$I00_ROOT" \
                --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" || result=1
              ;;
            held-out)
              python3 -m e2e.parallel_i00.held_out run --root "$I00_ROOT" || result=$?
              python3 -m e2e.parallel_i00.held_out review --root "$I00_ROOT" \
                --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" || result=1
              ;;
            endurance)
              python3 -m e2e.parallel_i00.endurance --root "$I00_ROOT" \
                --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" || result=$?
              python3 -m e2e.parallel_i00.endurance_review --root "$I00_ROOT" \
                --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" --out "$I00_ROOT/review.json" || result=1
              ;;
            recipe-*|table-*)
              python3 -m e2e.parallel_i00.choice_cuts run --root "$I00_ROOT" \
                --operation "$I00_TRACK" || result=$?
              python3 -m e2e.parallel_i00.choice_cuts review --root "$I00_ROOT" \
                --operation "$I00_TRACK" --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" || result=1
              ;;
            *) exit 2 ;;
          esac
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.prepare.outputs.root != '' }}
        with:
          name: i00-coverage-${{ matrix.track }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: ${{ steps.prepare.outputs.root }}/
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.prepare.outputs.root != '' }}
        with:
          name: i00-review-${{ matrix.track }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ steps.prepare.outputs.root }}/review.json

      - name: Preserve compact failure diagnostics alongside the complete raw archive
        if: ${{ always() && steps.prepare.outputs.root != '' }}
        run: python3 -m e2e.parallel_i00.diagnostics --root "${{ steps.prepare.outputs.root }}" --out "build/i00-diagnostics/coverage-${{ matrix.track }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.prepare.outputs.root != '' }}
        with:
          name: i00-diagnostics-coverage-${{ matrix.track }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: build/i00-diagnostics/coverage-${{ matrix.track }}/

  qualify:
    name: Reconcile all mandatory native evidence for this exact candidate
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.full == 'true' }}
    needs:
      - build
      - smoke
      - fixed-wheat
      - a-recovery
      - b-compatibility
      - walkthrough
      - coverage
      - regression-ci
      - regression-accomplishment-evidence
      - regression-knowledge-apprenticeship
      - regression-primitive-diagnostics
      - regression-goal-planning
      - regression-observed-knowledge
      - regression-world-retention
      - regression-save-compatibility
      - regression-blueprint-boundary
      - regression-prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      I00_JAR_SHA256: ${{ needs.build.outputs.production_sha256 }}
      I00_WORKFLOW_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: i00-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        with:
          pattern: i00-review-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/i00-downloads
      - name: Require original, later held-out, adversarial and endurance denominators
        run: |
          python3 -m e2e.parallel_i00.bundle verify --jar-sha256 "$I00_JAR_SHA256" --observer b
          python3 -m e2e.parallel_i00.qualification --artifacts build/i00-downloads --out build/i00-qualification \
            --source "$GITHUB_SHA" --jar-sha256 "$I00_JAR_SHA256" --shard-count 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i00-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: build/i00-qualification/
