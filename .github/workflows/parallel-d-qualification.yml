name: Parallel D qualification
on:
  push:
    branches: [feature/storage-mobility-logistics]
    paths:
      - e2e/parallel_d/blocking-request.json
      - e2e/parallel_d/qualification-request.json
permissions:
  contents: read
concurrency:
  group: cc-d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D_ROOT: build/e2e/parallel-d/D00
      CC_D_REQUIRE_BUILT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate intentional request and immutable inputs
        id: request
        run: |
          mkdir -p "$D_ROOT"
          python3 e2e/parallel_d/request.py
          python3 e2e/parallel_d/contracts/verify_contract.py --contract e2e/parallel_d/contracts
          python3 e2e/parallel_d/materialize_docs.py --root ../CognitiveCraft-Documentation-D
          python3 e2e/parallel_d/ownership.py --docs-root ../CognitiveCraft-Documentation-D
          python3 e2e/parallel_d/docs_check.py --docs-root ../CognitiveCraft-Documentation-D --stage D00
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Build one release, run all modules and compile the isolated D fixture
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --no-build-cache --stacktrace -I e2e/parallel_d/native/fixture.init.gradle :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar :fabric:parallelDNativeJar 2>&1 | tee "$D_ROOT/gradle.log"
          sha256sum fabric/build/libs/ai-villages-0.1.0.jar > "$D_ROOT/release-before.sha256"
      - name: Reuse integrity-checked established server and real-client SDKs
        shell: bash
        run: |
          set -euo pipefail
          python3 e2e/runtime.py prepare 2>&1 | tee "$D_ROOT/sdk-prepare.log"
          python3 e2e/runtime.py compile 2>&1 | tee "$D_ROOT/driver-compile.log"
      - name: Prepare established Docker runtime and record immutable image identities
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker build --build-arg E2E_UID="$(id -u)" --build-arg E2E_GID="$(id -g)" -t cognitivecraft-e2e:java25 -f e2e/Dockerfile . 2>&1 | tee "$D_ROOT/docker-runtime-build.log"
          docker build -t "cognitivecraft-d-tools:$GITHUB_SHA" -f e2e/parallel_d/Dockerfile . 2>&1 | tee "$D_ROOT/docker-tools-build.log"
          docker image inspect cognitivecraft-e2e:java25 > "$D_ROOT/runtime-image.json"
          docker image inspect "cognitivecraft-d-tools:$GITHUB_SHA" > "$D_ROOT/tools-image.json"
          docker image inspect eclipse-temurin:25-jdk-noble > "$D_ROOT/base-image.json"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['D_ROOT'])
          runtime=json.loads((root/'runtime-image.json').read_text())[0]
          tools=json.loads((root/'tools-image.json').read_text())[0]
          base=json.loads((root/'base-image.json').read_text())[0]
          value={'executor':'docker-compose','image_id':tools['Id'],'runtime_image_id':runtime['Id'],'base_image_id':base['Id'],'base_repo_digests':base['RepoDigests'],'workflow_run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT'])}
          (root/'environment.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
          {
            echo "CC_D_REPO=$PWD"
            echo "CC_D_RUN_ROOT=$PWD/$D_ROOT"
            echo "CC_D_RUNTIME_IMAGE=cognitivecraft-e2e:java25"
            echo "CC_D_TOOLS_IMAGE=cognitivecraft-d-tools:$GITHUB_SHA"
            echo "E2E_UID=$(id -u)"
            echo "E2E_GID=$(id -g)"
          } >> "$GITHUB_ENV"
      - name: Docker packaging, isolation, contract and tamper controls with raw XML collection
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f e2e/parallel_d/compose.yml config > "$D_ROOT/resolved-compose.yml"
          docker compose -f e2e/parallel_d/compose.yml run --rm -e CC_D_EXECUTOR=docker-compose -e CC_D_REQUIRE_BUILT=1 tools e2e/parallel_d/stage.py run --stage D00 --built --root /evidence
      - name: Independent exact-candidate oracle and final ownership/parity audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 e2e/parallel_d/verify.py --stage D00 --root "$D_ROOT" --source "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" --jar fabric/build/libs/ai-villages-0.1.0.jar --output "$D_ROOT/qualified.json"
          python3 e2e/parallel_d/ownership.py --docs-root ../CognitiveCraft-Documentation-D --require-built
          sha256sum --check "$D_ROOT/release-before.sha256"
      - name: Remove only this D Compose project's containers and network
        if: always()
        run: |
          if [ -n "${CC_D_RUNTIME_IMAGE:-}" ]; then
            docker compose -f e2e/parallel_d/compose.yml down --remove-orphans
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parallel-d-D00-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            build/e2e/parallel-d/D00/
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
            fabric/build/libs/ai-villages-0.1.0-gametest.jar
            build/parallel-d-native/
            build/e2e-sdk/integrity.json
