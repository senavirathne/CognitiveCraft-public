name: Citizen identity acceptance

on:
  push:
    branches: [imp-008-citizen-identity, imp-009-needle-intent]
    paths:
      - 'core/**'
      - 'fabric/**'
      - '.github/workflows/citizen-identity.yml'
  pull_request:
    branches: [main, imp-007-bootstrap-controller]
    paths:
      - 'core/**'
      - 'fabric/**'
      - '.github/workflows/citizen-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitivecraft-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: GP-09 saved-world identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Select isolated citizen identity saved-world fixture
        run: |
          mkdir -p fabric/build/gametest-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('fabric/src/gameTest/resources/fabric.mod.json')
          testmod = json.loads(path.read_text())
          testmod['entrypoints']['fabric-gametest'] = ['dev.aivillages.fabric.CitizenIdentityGameTests']
          path.write_text(json.dumps(testmod, indent=2) + '\n')
          PY
      - name: Citizen identity names, scopes and physical serial tasks
        timeout-minutes: 5
        env:
          COGNITIVECRAFT_IDENTITY_RESTART: cold
          JAVA_TOOL_OPTIONS: -Dcognitivecraft.gametest.trace=true
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Verify cold identity acceptance and preserve saved-world evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET
          report = Path('fabric/build/gametest-run/gametest-results.xml')
          cases = [c for c in ET.parse(report).getroot().iter('testcase')
                   if c.get('name', '').startswith('ai_villages_tests:')]
          fixture = 'citizen_identity_game_tests_named_citizens_preserve_scoped_identity_and_offline_tasks_after_server_reload'
          if len(cases) != 1 or not cases[0].get('name', '').endswith(fixture) or any(
                  c.find(tag) is not None for c in cases for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('Expected one passing GP-09 cold identity case')
          evidence = Path('fabric/build/gametest-evidence')
          log = report.parent / 'logs/latest.log'
          text = log.read_text()
          for token in ('IMP-008 identity accepted warm=false', 'candidates=2 foreignCandidates=1',
                        'serialCitizens=3 cancelledEffects=0 newModelCalls=0 delivered=3',
                        'identitySchema=1 journalSchema=2', 'migrationOnce=true warm=false'):
              if token not in text: raise SystemExit('Missing identity acceptance marker: ' + token)
          shutil.copy2(report, evidence / 'identity-cold.xml')
          shutil.copy2(log, evidence / 'identity-cold.log')
          markers = list(report.parent.rglob('identity-restart.json'))
          if len(markers) != 1: raise SystemExit('Expected one durable identity restart marker')
          world = markers[0].parent
          shutil.copy2(markers[0], evidence / 'identity-restart.json')
          shutil.copy2(world / 'data/cognitivecraft/citizens/v1/state.json', evidence / 'identity-cold-state.json')
          shutil.copy2(world / 'data/cognitivecraft/bootstrap/v1/state.json', evidence / 'identity-cold-runs.json')
          shutil.copy2(world / 'data/cognitivecraft/bootstrap/v1/state.legacy-v1.json', evidence / 'identity-legacy-v1.json')
          print('Verified three named citizens, two scoped principals and actual offline physical tasks')
          PY
      - name: Restart Minecraft and reuse named citizens with inference disabled
        timeout-minutes: 5
        env:
          COGNITIVECRAFT_IDENTITY_RESTART: warm
          JAVA_TOOL_OPTIONS: -Dcognitivecraft.gametest.trace=true
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Verify stable saved identities and focused acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          import xml.etree.ElementTree as ET
          report = Path('fabric/build/gametest-run/gametest-results.xml')
          cases = [c for c in ET.parse(report).getroot().iter('testcase')
                   if c.get('name', '').startswith('ai_villages_tests:')]
          if len(cases) != 1 or any(c.find(tag) is not None for c in cases for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('Expected one passing GP-09 warm identity case')
          evidence = Path('fabric/build/gametest-evidence')
          log = report.parent / 'logs/latest.log'
          text = log.read_text()
          for token in ('IMP-008 identity accepted warm=true', 'candidates=2 foreignCandidates=1',
                        'serialCitizens=3 cancelledEffects=0 newModelCalls=0 delivered=5',
                        'identitySchema=1 journalSchema=2', 'migrationOnce=true warm=true'):
              if token not in text: raise SystemExit('Missing reload acceptance marker: ' + token)
          shutil.copy2(report, evidence / 'identity-warm.xml')
          shutil.copy2(log, evidence / 'identity-warm.log')
          markers = list(report.parent.rglob('identity-restart.json'))
          if len(markers) != 1: raise SystemExit('Missing saved identity marker')
          world = markers[0].parent
          for source, target in (('citizens/v1/state.json','identity-warm-state.json'),
                                 ('bootstrap/v1/state.json','identity-warm-runs.json')):
              shutil.copy2(world / 'data/cognitivecraft' / source, evidence / target)
          original = (evidence / 'identity-legacy-v1.json').read_bytes()
          current = (world / 'data/cognitivecraft/bootstrap/v1/state.legacy-v1.json').read_bytes()
          if current != original: raise SystemExit('Reload rewrote legacy migration source')
          proof = json.loads((evidence / 'identity-restart.json').read_text())
          if hashlib.sha256(current).hexdigest() != proof['legacySha256']:
              raise SystemExit('Legacy source digest does not match acceptance marker')
          cold = json.loads((evidence / 'identity-cold-state.json').read_text())
          warm = json.loads((evidence / 'identity-warm-state.json').read_text())
          if cold['bootstrapMigration'] != warm['bootstrapMigration'] or len(warm['citizens']) != 3:
              raise SystemExit('Migration repeated or duplicated identities')
          if cold['citizens'] != warm['citizens']:
              raise SystemExit('Names, control scopes, entity bindings or availability changed on reload')
          PY
      - name: Preserve focused identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            fabric/build/gametest-evidence/
            fabric/build/gametest-run/gametest-results.xml
            fabric/build/gametest-run/logs/
            fabric/build/gametest-run/crash-reports/
