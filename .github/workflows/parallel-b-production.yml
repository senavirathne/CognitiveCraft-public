name: Parallel B production and planning
on:
  push:
    branches: [impl/activity-production-planning]
    paths: ['core/**', 'fabric/**', 'e2e/parallel_b/**', 'e2e/campaigns/**', 'scripts/campaign-crafting/**', 'scripts/campaign-world/**', 'e2e/artifact_selection.py', 'e2e/suite.py', '.github/workflows/parallel-b-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: cc-production-b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  b01-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Baseline modules and isolated B contract fixtures
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/crafting -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/world -p 'test_*.py'
      - name: Hash-verified native runtime and isolated instruments
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 scripts/campaign-crafting/prepare.py
          python3 scripts/campaign-crafting/prepare.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40257555612
          name: parallel-b-B00-f7f121859891506c5c0c2c4db7314bea56d47435-40257555612-1
          path: build/parallel-b-seed/B00
      - name: Real craft, exact collector refusals and actual kill barriers
        run: python3 e2e/parallel_b/native_qualification.py --root build/e2e/parallel-b/B01 --seed build/parallel-b-seed/B00
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-b-B01-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/e2e/parallel-b/B01/
            build/campaign-crafting-oracle/integrity.json
            build/e2e-sdk/integrity.json
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
