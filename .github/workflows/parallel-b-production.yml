name: Parallel B production and planning
on:
  push:
    branches: [impl/activity-production-planning]
    paths: ['core/**', 'fabric/**', 'e2e/parallel_b/**', 'e2e/campaigns/**', 'scripts/campaign-crafting/**', 'scripts/campaign-world/**', 'e2e/artifact_selection.py', 'e2e/suite.py', '.github/workflows/parallel-b-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: cc-production-b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  b08-freeze:
    if: ${{ contains(github.event.head_commit.message, '[b08-freeze]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/crafting -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/world -p 'test_*.py'
          python3 e2e/parallel_b/campaign_contracts.py verify
          python3 e2e/parallel_b/branch_qualification.py --ownership-only --output build/B08-freeze-ownership.json
  b08-exact-candidate:
    if: ${{ contains(github.event.head_commit.message, '[b08-native]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      B08_ROOT: build/e2e/parallel-b/B08
      COGNITIVECRAFT_B_QUALIFICATION_PROJECT: cc-b08-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: All owned module, planner, compatibility and qualification checks
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/crafting -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/world -p 'test_*.py'
          python3 e2e/parallel_b/campaign_contracts.py verify
          python3 e2e/parallel_b/branch_qualification.py --ownership-only --output build/B08-ownership.json
      - name: Prepare verified clients and isolated read-only instruments once
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 scripts/campaign-crafting/prepare.py
          python3 e2e/parallel_b/prepare_diagnostics.py
      - name: Broader actual native recipe, planning, placement, bread and harvest hosts
        run: |
          python3 e2e/parallel_b/run_hosts.py --root "$B08_ROOT/hosts" --built --extra-mod build/e2e-driver/observer.jar \
            --entrypoint dev.aivillages.fabric.GeneralizedRecipeChoiceGameTests \
            --entrypoint dev.aivillages.fabric.ConcretePlankChoiceGameTests \
            --entrypoint dev.aivillages.fabric.PlanningChoiceHostGameTests \
            --entrypoint dev.aivillages.fabric.BirchPlankEffectGameTests \
            --entrypoint dev.aivillages.fabric.OakPlankEffectGameTests \
            --entrypoint dev.aivillages.fabric.StickEffectGameTests \
            --entrypoint dev.aivillages.fabric.AxeEffectGameTests \
            --entrypoint dev.aivillages.fabric.TableEffectGameTests \
            --entrypoint dev.aivillages.fabric.PlacementEffectGameTests \
            --entrypoint dev.aivillages.fabric.ParallelBLegacyBreadGameTests \
            --entrypoint dev.aivillages.fabric.OakLogEffectGameTests \
            --entrypoint dev.aivillages.fabric.BirchLogEffectGameTests
      - name: Genuine exact-quantity, old-stock and capacity connected-client controls
        run: |
          python3 e2e/parallel_b/quantity_native.py --root "$B08_ROOT/quantity"
          python3 e2e/parallel_b/native_audit.py --root "$B08_ROOT/quantity"
      - name: Same-JAR stopped-world method reuse, native kill and collector negative controls
        run: |
          python3 e2e/parallel_b/native_qualification.py --root "$B08_ROOT/harness" --seed-root "$B08_ROOT/quantity"
          python3 e2e/parallel_b/native_audit.py --root "$B08_ROOT/harness"
      - name: Both controlled delivery families with zero model calls after admission
        run: |
          python3 e2e/parallel_b/diagnostics.py --root "$B08_ROOT/diagnostics"
          python3 e2e/parallel_b/native_audit.py --root "$B08_ROOT/diagnostics"
          python3 e2e/parallel_b/verify_diagnostics.py "$B08_ROOT/diagnostics" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" e2e/parallel_b/diagnostic-matrix.json
      - name: Genuine second-client window, late control and shared-method privacy regression
        run: |
          python3 e2e/parallel_b/interference_native.py --root "$B08_ROOT/interference"
          python3 e2e/parallel_b/native_audit.py --root "$B08_ROOT/interference"
      - name: Verify every owned gate on one source, tree, run, attempt and production JAR
        run: python3 e2e/parallel_b/branch_qualification.py --root "$B08_ROOT" --output build/parallel-b-B08-review
      - name: Preserve failed or incomplete native candidate separately
        if: failure()
        run: python3 e2e/parallel_b/branch_qualification.py --root "$B08_ROOT" --output build/parallel-b-B08-failed-review --retain-incomplete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-b-B08-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/e2e/parallel-b/B08/
            build/B08-ownership.json
            build/b-diagnostics/integrity.json
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
            fabric/build/libs/ai-villages-0.1.0-gametest.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-b-B08-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/parallel-b-B08-review/
            build/parallel-b-B08-failed-review/
  b07-frozen-contracts:
    if: ${{ contains(github.event.head_commit.message, '[b07-freeze]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
          python3 e2e/parallel_b/campaign_contracts.py verify
  b06-controlled-diagnostics:
    if: ${{ !contains(github.event.head_commit.message, '[b06-review]') && !contains(github.event.head_commit.message, '[b07-') && !contains(github.event.head_commit.message, '[b08-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Baseline modules and isolated B contract fixtures
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/crafting -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/world -p 'test_*.py'
      - name: Hash-verified client runtime and isolated read-only diagnostics
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 scripts/campaign-crafting/prepare.py
          python3 e2e/parallel_b/prepare_diagnostics.py
      - name: Controlled seven-log and saved-method connected-client matrix
        run: python3 e2e/parallel_b/diagnostics.py --root build/e2e/parallel-b/B06
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-b-B06-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/e2e/parallel-b/B06/
            build/b-diagnostics/integrity.json
            build/campaign-crafting-oracle/integrity.json
            build/e2e-sdk/integrity.json
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
            fabric/build/libs/ai-villages-0.1.0-gametest.jar
  b07-native-interference:
    if: ${{ contains(github.event.head_commit.message, '[b07-native]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Owned logic and frozen qualification guards
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/crafting -p 'test_*.py'
          python3 -m unittest discover -s e2e/campaigns/world -p 'test_*.py'
          python3 e2e/parallel_b/campaign_contracts.py verify
          python3 e2e/parallel_b/contract_runner.py --output build/e2e/parallel-b/B07-pending.json
      - name: Prepare hash-verified native clients and read-only final-check observer
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 scripts/campaign-crafting/prepare.py
          python3 e2e/parallel_b/prepare_diagnostics.py
      - name: Genuine PlayerB preflight-window transfer and deliberately late control
        run: python3 e2e/parallel_b/interference_native.py --root build/e2e/parallel-b/B07
      - name: Independent raw resource audit including genuine admission
        if: ${{ always() && hashFiles('build/e2e/parallel-b/B07/server/stdout.log') != '' }}
        run: python3 e2e/parallel_b/native_audit.py --root build/e2e/parallel-b/B07
      - name: Verify exact native producer and expose reviewable original vectors
        if: ${{ always() && hashFiles('build/e2e/parallel-b/B07/manifest.json') != '' }}
        run: python3 e2e/parallel_b/stage_review.py --root build/e2e/parallel-b/B07 --output build/parallel-b-B07-review --retain-failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-b-B07-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/e2e/parallel-b/B07/
            build/e2e/parallel-b/B07-pending.json
            build/b-diagnostics/integrity.json
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-b-B07-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: build/parallel-b-B07-review/
  b06-review-evidence:
    if: ${{ contains(github.event.head_commit.message, '[b06-review]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Evidence transport identity and refusal regressions
        run: python3 -m unittest discover -s e2e/parallel_b -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40354898095
          name: parallel-b-B06-a7fbaae77eb88fd6f4992374ab425c23d196de2b-40354898095-1
          path: build/parallel-b-native
      - name: Verify native producer and package original review evidence
        env:
          NATIVE_REVIEW_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/parallel_b/review_bundle.py --source build/parallel-b-native --output build/parallel-b-review \
            --head a7fbaae77eb88fd6f4992374ab425c23d196de2b --tree 21d6d5fe31477bb2fa43534c2f2ca470253f32a0 \
            --run 40354898095 --artifact-name parallel-b-B06-a7fbaae77eb88fd6f4992374ab425c23d196de2b-40354898095-1
      - name: Independently verify and expose bounded original native vectors
        run: |
          python3 e2e/parallel_b/verify_diagnostics.py build/parallel-b-review/build/e2e/parallel-b/B06 a7fbaae77eb88fd6f4992374ab425c23d196de2b 21d6d5fe31477bb2fa43534c2f2ca470253f32a0 e2e/parallel_b/diagnostic-matrix.json
          python3 e2e/parallel_b/emit_review_audit.py --root build/parallel-b-review --label final
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-b-B06-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: build/parallel-b-review/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40353653834
          name: parallel-b-B06-6c51554f8d3105da83f82df8a1be441a5e04610f-40353653834-1
          path: build/parallel-b-prior
      - name: Retain prior completed candidate separately from final qualification
        env:
          NATIVE_REVIEW_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/parallel_b/review_bundle.py --source build/parallel-b-prior --output build/parallel-b-review-prior \
            --head 6c51554f8d3105da83f82df8a1be441a5e04610f --tree 32acb11297a00341c187e0938f32db8f4eab9fb5 \
            --run 40353653834 --artifact-name parallel-b-B06-6c51554f8d3105da83f82df8a1be441a5e04610f-40353653834-1
      - name: Expose the retained prior candidate under its own source identity
        run: python3 e2e/parallel_b/emit_review_audit.py --root build/parallel-b-review-prior --label prior
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-b-B06-review-prior-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: build/parallel-b-review-prior/
