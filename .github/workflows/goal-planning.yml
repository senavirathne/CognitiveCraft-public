name: Bounded goal planning acceptance

on:
  workflow_dispatch:
  pull_request:
    paths: ['e2e/**', 'core/**', 'providers/**', 'fabric/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/goal-planning.yml', '.github/implementation/IMP-019*']
  push:
    branches-ignore:
      - 'feature/player-assisted-dialogue'
      - 'feature/storage-mobility-logistics'
      - 'integration/qualified-ab-conversation-logistics'
    paths: ['e2e/**', 'core/**', 'providers/**', 'fabric/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/goal-planning.yml', '.github/implementation/IMP-019*']

permissions:
  contents: read

concurrency:
  group: goal-planning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: IMP-019 matrix, regressions and two-JVM GP-19
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Execute every IMP-019 matrix case
        run: bash ./gradlew --no-daemon --stacktrace :core:test --tests dev.aivillages.core.kernel.GoalPlannerTest --tests dev.aivillages.core.kernel.PlanJournalTest --tests dev.aivillages.core.kernel.GoalPlannerCorrectionTest --tests dev.aivillages.core.kernel.MaterialPlanTest --tests dev.aivillages.core.kernel.PlanningConstraintTest :providers:test --tests dev.aivillages.providers.PlanningAdapterTest --tests dev.aivillages.providers.MaterialPlanningAdapterTest --tests dev.aivillages.providers.PlanningBenchmarkCasesTest
      - name: Require all matrix cases to execute and pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for module,suite,expected in [('core','GoalPlannerTest',46),('core','PlanJournalTest',12),('providers','PlanningAdapterTest',4),('core','GoalPlannerCorrectionTest',9),('core','MaterialPlanTest',10),('core','PlanningConstraintTest',7),('providers','MaterialPlanningAdapterTest',8),('providers','PlanningBenchmarkCasesTest',3)]:
              package='dev.aivillages.core.kernel.' if module=='core' else 'dev.aivillages.providers.'
              cases=list(ET.parse(Path(module)/'build/test-results/test'/('TEST-'+package+suite+'.xml')).getroot().iter('testcase'))
              if len(cases)!=expected or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
                  raise SystemExit('Every matrix case must execute and pass: '+suite)
          print('IMP-019 matrix: 99 executed passing cases')
          PY
      - name: Execute complete affected module regressions and build packaging
        run: bash ./gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar
      - name: Select cold GP-19 and saved Minecraft witness
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');m=json.loads(p.read_text())
          m['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.PlanningGameTests','dev.aivillages.fabric.ServerRestartProbeGameTests']
          p.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Reject invalid proposals, fence cancellation and execute known children offline
        timeout-minutes: 7
        env:
          COGNITIVECRAFT_PLANNING_RESTART: cold
          COGNITIVECRAFT_RESTART_PROBE: cold
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Require cold evidence and select a second JVM
        run: |
          python3 - <<'PY'
          import json,shutil,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('fabric/build/gametest-run');out=Path('fabric/build/planning-evidence');out.mkdir(parents=True,exist_ok=True)
          cases=[c for c in ET.parse(root/'gametest-results.xml').getroot().iter('testcase') if c.get('name','').startswith('ai_villages_tests:')]
          if len(cases)!=2 or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):raise SystemExit('Two passing executed cold project cases required')
          if 'IMP-019 GP-19 accepted phase=cold first=2 second=3 planningEffects=0 knownModelCalls=0 children=2 noReplay=true' not in (root/'logs/latest.log').read_text():raise SystemExit('Active cold GP-19 proof missing')
          shutil.copy2(root/'gametest-results.xml',out/'cold.xml');shutil.copy2(root/'logs/latest.log',out/'cold.log')
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');m=json.loads(p.read_text());m['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.PlanningRestartGameTests','dev.aivillages.fabric.ServerRestartProbeGameTests'];p.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Reopen the same world and owner records without inference or effects replay
        timeout-minutes: 7
        env:
          COGNITIVECRAFT_PLANNING_RESTART: warm
          COGNITIVECRAFT_RESTART_PROBE: warm
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Require warm evidence, full tests and clean production contents
        run: |
          python3 - <<'PY'
          import json,shutil,hashlib,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('fabric/build/gametest-run');out=Path('fabric/build/planning-evidence')
          cases=[c for c in ET.parse(root/'gametest-results.xml').getroot().iter('testcase') if c.get('name','').startswith('ai_villages_tests:')]
          if len(cases)!=2 or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):raise SystemExit('Two passing executed warm project cases required')
          if 'IMP-019 GP-19 accepted phase=warm first=2 second=3 planningEffects=0 knownModelCalls=0 children=2 noReplay=true' not in (root/'logs/latest.log').read_text():raise SystemExit('Active warm GP-19 proof missing')
          shutil.copy2(root/'gametest-results.xml',out/'warm.xml');shutil.copy2(root/'logs/latest.log',out/'warm.log')
          counts={}
          for module in ('core','providers','fabric'):
              cases=[c for p in Path(module+'/build/test-results/test').glob('TEST-*.xml') for c in ET.parse(p).getroot().iter('testcase')]
              if not cases or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):raise SystemExit('Complete executed module coverage required: '+module)
              counts[module]=len(cases)
          saved=root/'world/cognitivecraft-planning-fixture';cold=json.loads((saved/'cold.json').read_text());warm=json.loads((saved/'warm.json').read_text())
          for proof in (cold,warm):
              if (proof['first'],proof['second'],proof['planningEffects'],proof['knownModelCalls'])!=(2,3,0,0) or len(proof['children'])!=2:raise SystemExit('Owned actual delivery/no-inference witness failed')
          if cold['children']!=warm['children'] or cold['objective']!=warm['objective'] or (cold['proposalCalls'],warm['proposalCalls'])!=(5,0):raise SystemExit('Restart changed work or invoked inference')
          for name in ('cold.json','warm.json','restart.json'):shutil.copy2(saved/name,out/name)
          jars=[p for p in Path('fabric/build/libs').glob('*.jar') if not any(s in p.name for s in ('sources','gametest','dev'))]
          if len(jars)!=1:raise SystemExit('Exactly one production artifact required')
          with zipfile.ZipFile(jars[0]) as jar:
              if any('GameTest' in name or name.endswith(('.gguf','.safetensors')) for name in jar.namelist()):raise SystemExit('Test code or model weights leaked into release')
              for name in ('Plan','PlanningBudget','PlanValidator','PlanJournal','GoalPlanner','PlanningGoals'):
                  if 'dev/aivillages/core/kernel/'+name+'.class' not in jar.namelist():raise SystemExit('Planning runtime missing: '+name)
          evidence={'schema':1,'matrix':99,'tests':counts,'total':sum(counts.values()),'coldProjectTests':2,'warmProjectTests':2,'cold':cold,'warm':warm,'sha256':hashlib.sha256(jars[0].read_bytes()).hexdigest()}
          (out/'acceptance.json').write_text(json.dumps(evidence,indent=2)+'\n');print(evidence)
          PY
      - name: Restore full GameTest registration
        if: always()
        run: git restore fabric/src/gameTest/resources/fabric.mod.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imp-019-planning-acceptance
          path: |
            core/build/test-results/test/**
            providers/build/test-results/test/**
            fabric/build/test-results/test/**
            fabric/build/planning-evidence/**
            fabric/build/gametest-run/logs/**
            fabric/build/gametest-run/crash-reports/**
  legacy-reproduction:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Preserve original three-call protocol with actual prompt and candidate capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: b9a1d086ac6d5d0322f07219ffcf5b207aae3fa2
          path: legacy-reference
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Preserve old production bytes and add test-only evidence capture
        run: |
          mkdir -p providers/build/planning-legacy
          git -C legacy-reference diff --exit-code -- core/src/main providers/src/main fabric/src/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('legacy-reference/providers/src/test/java/dev/aivillages/providers/PlanningLiveBenchmark.java')
          old=p.read_text();needle='System.out.println("IMP-019 planning quality "+StrictJson.canonical(evidence));'
          assert old.count(needle)==1
          p.write_text(old.replace(needle,'evidence.put("prompt",context.prompt()); evidence.put("candidate",result.candidateIr()==null?"unavailable":result.candidateIr()); '+needle))
          PY
          git -C legacy-reference diff -- providers/src/test/java/dev/aivillages/providers/PlanningLiveBenchmark.java > providers/build/planning-legacy/test-instrumentation.patch
          lscpu > providers/build/planning-legacy/host-cpu.txt
          free -m > providers/build/planning-legacy/host-memory.txt
      - name: Acquire the original shared-backend model explicitly
        timeout-minutes: 15
        run: |
          docker run --detach --name cognitivecraft-legacy-ollama --publish 127.0.0.1:11434:11434 --env OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.12.10
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:11434/api/version && break
            sleep 2
          done
          pulled=false
          for pull_attempt in 1 2 3; do
            if docker exec cognitivecraft-legacy-ollama ollama pull qwen2.5:1.5b-instruct; then pulled=true; break; fi
            if [ "$pull_attempt" -lt 3 ]; then sleep 5; fi
          done
          test "$pulled" = true
          docker inspect cognitivecraft-legacy-ollama > providers/build/planning-legacy/backend-container.json
          curl --fail --silent http://127.0.0.1:11434/api/tags > providers/build/planning-legacy/model-tags.json
      - name: Replay the unchanged original quantities, prompt, schema and one-call protocol
        working-directory: legacy-reference
        env:
          COGNITIVECRAFT_OLLAMA_MODEL: qwen2.5:1.5b-instruct
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :providers:runPlanningLiveBenchmark | tee ../providers/build/planning-legacy/held-out.log
      - name: Retain historical failures and new replay separately without a success-rate gate
        run: |
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          root=Path('providers/build/planning-legacy');marker='IMP-019 planning quality '
          rows=[json.loads(line.split(marker,1)[1]) for line in (root/'held-out.log').read_text().splitlines() if marker in line]
          assert len(rows)==3 and [r['quantities'] for r in rows]==[[1,4],[3,2],[2,6]]
          assert all(r['inputBytes']>0 and r['outputBytes']>0 and r['latencyMillis']>0 for r in rows)
          assert all(r['modelDigest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b' for r in rows)
          historical=json.loads(Path('providers/src/test/resources/planning/legacy-evidence.json').read_text())
          for r in historical['cases']:
              assert hashlib.sha256(r['candidate'].encode()).hexdigest()==r['candidateSha256']
          proof={'schema':1,'referenceSource':'b9a1d086ac6d5d0322f07219ffcf5b207aae3fa2','referenceTree':subprocess.check_output(['git','-C','legacy-reference','rev-parse','HEAD^{tree}'],text=True).strip(),'testOnlyInstrumentation':True,'productionUnchanged':True,'historical':historical,'reproduction':rows,'scope':'Original three-case protocol; fixture UUIDs were not retained historically, so exact original prompt bytes cannot be replayed. Recovered historical candidates match original hashes. No effects or native-admission claim.'}
          (root/'legacy-evidence.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps({'historicalValid':1,'historicalTotal':3,'reproductionValid':sum(r['valid'] for r in rows),'reproductionTotal':3}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-legacy-reproduction-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: providers/build/planning-legacy/**
  quality-measurements:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: IMP-019 proposal measurements (${{ matrix.model }}, shard ${{ matrix.shard }})
    needs: legacy-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: 'qwen2.5:1.5b-instruct', id: '15b', shard: 0}
          - {model: 'qwen2.5:1.5b-instruct', id: '15b', shard: 1}
          - {model: 'qwen2.5:1.5b-instruct', id: '15b', shard: 2}
          - {model: 'qwen2.5:1.5b-instruct', id: '15b', shard: 3}
          - {model: 'qwen2.5:3b-instruct', id: '3b', shard: 0}
          - {model: 'qwen2.5:3b-instruct', id: '3b', shard: 1}
          - {model: 'qwen2.5:3b-instruct', id: '3b', shard: 2}
          - {model: 'qwen2.5:3b-instruct', id: '3b', shard: 3}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Execute production validator, correction and wire-contract regressions first
        run: bash ./gradlew --no-daemon --stacktrace :core:test :providers:test
      - name: Record host and start the same pinned CPU backend for each comparison arm
        timeout-minutes: 15
        env:
          MODEL: ${{ matrix.model }}
        run: |
          mkdir -p providers/build/planning-quality
          lscpu > providers/build/planning-quality/host-cpu.txt
          free -m > providers/build/planning-quality/host-memory.txt
          docker run --detach --name cognitivecraft-planning-ollama --publish 127.0.0.1:11434:11434 --env OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.12.10
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:11434/api/version && break
            sleep 2
          done
          pulled=false
          for pull_attempt in 1 2 3; do
            if docker exec cognitivecraft-planning-ollama ollama pull "$MODEL"; then pulled=true; break; fi
            if [ "$pull_attempt" -lt 3 ]; then sleep 5; fi
          done
          test "$pulled" = true
          docker inspect cognitivecraft-planning-ollama > providers/build/planning-quality/backend-container.json
          curl --fail --silent http://127.0.0.1:11434/api/tags > providers/build/planning-quality/model-tags.json
          docker exec cognitivecraft-planning-ollama ollama show "$MODEL" > providers/build/planning-quality/model-details.txt
      - name: Measure the assigned requests with at most one correction per proposal
        timeout-minutes: 32
        env:
          COGNITIVECRAFT_OLLAMA_MODEL: ${{ matrix.model }}
          PLANNING_BENCHMARK_SHARD: ${{ matrix.shard }}
          PLANNING_BENCHMARK_SHARDS: '4'
          PLANNING_BENCHMARK_DATASET: acceptance-requests.json
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :providers:runPlanningLiveBenchmark | tee providers/build/planning-quality/held-out.log
      - name: Retain backend resource use and diagnostics
        if: always()
        run: |
          mkdir -p providers/build/planning-quality
          docker stats --no-stream cognitivecraft-planning-ollama > providers/build/planning-quality/backend-resources.txt || true
          docker logs cognitivecraft-planning-ollama > providers/build/planning-quality/backend.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-measurements-${{ matrix.id }}-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: providers/build/planning-quality/**
  held-out-quality:
    name: IMP-019 genuine held-out shared-backend quality and latency
    needs: quality-measurements
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test measurement integrity independently of model success rate
        run: python3 -m unittest discover -s scripts -p test_planning_quality.py
      - uses: actions/download-artifact@v4
        with:
          pattern: planning-measurements-*
          path: providers/build/planning-quality/imports
      - name: Require 50 frozen genuine measurements per model and report quality separately
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/planning-quality.py providers/build/planning-quality --head "$REVIEWED_HEAD" --expected-dataset-sha 629798799640026f8ae7f096027bece765d3dda74386fbbceead0237be76a9a9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imp-019-held-out-planning-quality-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: providers/build/planning-quality/acceptance.json
