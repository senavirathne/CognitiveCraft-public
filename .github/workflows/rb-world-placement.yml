name: Agent 1 Task 1.1 physical table placement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-placement-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAVA_TOOL_OPTIONS: '-Dcognitivecraft.gametest.trace=true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: All existing module cases and production binary
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestClasses :fabric:gameTestJar
          python3 scripts/verify-rb006b.py junit
          python3 scripts/verify-rb006b.py identity
      - name: Select original placement effects plus independent physical variants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json')
          value=json.loads(p.read_text())
          value['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.WorldPlacementGameTests']
          p.write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Actual native placement, crossing collision, self occupancy and center ray
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-world-placement.py variants
      - name: Select original actual consumption and safety regression in a separate JVM
        run: |
          mv fabric/build/gametest-run fabric/build/world-placement-variants-run
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json')
          value=json.loads(p.read_text())
          value['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.PlacementEffectGameTests']
          p.write_text(json.dumps(value,indent=2)+'\n')
          PY
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-world-placement.py original

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-placement-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/rb006b-evidence/
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/gametest-run/
            fabric/build/world-placement-variants-run/
            fabric/build/libs/
  connected-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Production binary and existing harness integrity
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:build
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 scripts/verify-rb006b.py identity
      - name: Original connected-client sequence through empty-stock placement and owned root completion
        run: |
          python3 e2e/suite.py --profile rb006b-placement --root build/e2e/rb006b-placement
          python3 scripts/verify-world-placement.py client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-placement-connected-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/rb006b-evidence/
            build/e2e/rb006b-placement/
            build/e2e-sdk/integrity.json
            fabric/build/libs/ai-villages-0.1.0.jar
