name: Resource lease acceptance
on:
  push:
    branches: [main, feature/imp012-resource-leases]
    paths: ['core/**', 'fabric/**', '.github/workflows/resource-leases.yml']
  pull_request:
    branches: [main]
    paths: ['core/**', 'fabric/**', '.github/workflows/resource-leases.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cognitivecraft-leases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  leases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Lease policy, persistence and adapter regression; Fabric build
        run: bash ./gradlew --no-daemon --stacktrace :core:test :fabric:test :fabric:build
      - name: Require executed lease, owner, persistence and bound matrices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          counts={}
          for module,suite,minimum in [('core','ResourceLeaseServiceTest',50),('core','ResourceLeaseJournalTest',15),
                                     ('core','JobLeaseOwnersTest',8),('core','ResourceLeaseBoundsTest',2),
                                     ('core','LeasedGatewayIntegrationTest',7),
                                     ('fabric','LeaseTargetWitnessesTest',4)]:
              package='dev.aivillages.'+('core.kernel' if module=='core' else 'fabric')
              cases=list(ET.parse(Path(module)/'build/test-results/test'/('TEST-'+package+'.'+suite+'.xml')).getroot().iter('testcase'))
              if len(cases)<minimum or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
                  raise SystemExit('Missing successful lease matrix: '+suite)
              counts[suite]=len(cases)
          evidence=Path('core/build/lease-evidence')
          evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'acceptance.json').write_text(json.dumps({'schema':1,'architecture':'0.3','leaseSchema':1,'cases':counts},indent=2)+'\n')
          print('IMP-012 pure acceptance '+json.dumps(counts))
          PY
      - name: Select isolated two-client fixture with all models disabled
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('fabric/src/gameTest/resources/fabric.mod.json')
          manifest=json.loads(path.read_text())
          manifest['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.ResourceLeaseGameTests']
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Five actual units, two claims of three, cancellation, expiry and mutation
        timeout-minutes: 5
        env:
          COGNITIVECRAFT_LEASE_RESTART: cold
          JAVA_TOOL_OPTIONS: -Dcognitivecraft.gametest.trace=true
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Preserve physical cold evidence and active lease snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, xml.etree.ElementTree as ET
          root=Path('fabric/build/gametest-run')
          cases=[c for c in ET.parse(root/'gametest-results.xml').getroot().iter('testcase') if c.get('name','').startswith('ai_villages_tests:')]
          if len(cases)!=1 or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
              raise SystemExit('One passing cold lease fixture required')
          log=(root/'logs/latest.log').read_text()
          if 'IMP-012 physical accepted warm=false' not in log or 'modelCalls=0 leaseSchema=1 architecture=0.3' not in log:
              raise SystemExit('Missing cold physical lease proof')
          markers=list(root.rglob('lease-restart.json'))
          if len(markers)!=1: raise SystemExit('One saved lease restart marker required')
          evidence=Path('core/build/lease-evidence')
          path=markers[0].parent
          state=path/'data/cognitivecraft/leases/v1/state.jsonl'
          rows=[json.loads(line) for line in state.read_text().splitlines()]
          if sum(r['state']=='ACTIVE' for r in rows[1:])!=1: raise SystemExit('Saved active lease was not tested')
          for source,name in [(root/'gametest-results.xml','leases-cold.xml'),(root/'logs/latest.log','leases-cold.log'),
                              (markers[0],'lease-restart.json'),(state,'leases-cold.jsonl'),(path/'lease-cold-evidence.json','physical-cold.json')]:
              shutil.copy2(source,evidence/name)
          PY
      - name: Separate Minecraft JVM, inactive restoration, original epoch fenced
        timeout-minutes: 5
        env:
          COGNITIVECRAFT_LEASE_RESTART: warm
          JAVA_TOOL_OPTIONS: -Dcognitivecraft.gametest.trace=true
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Verify physical conservation, recovery, privacy and bounded snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, xml.etree.ElementTree as ET
          root=Path('fabric/build/gametest-run')
          cases=[c for c in ET.parse(root/'gametest-results.xml').getroot().iter('testcase') if c.get('name','').startswith('ai_villages_tests:')]
          if len(cases)!=1 or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
              raise SystemExit('One passing warm lease fixture required')
          text=(root/'logs/latest.log').read_text()
          for token in ('IMP-012 physical accepted warm=true','scopes=2 workers=2 requests=3+3 initialStock=5',
                        'cancelledCredit=2 succeededCredit=3 physicalWheat=5','noReplay=true oldEpochFenced=true modelCalls=0'):
              if token not in text: raise SystemExit('Missing lease evidence: '+token)
          markers=list(root.rglob('lease-restart.json'))
          if len(markers)!=1: raise SystemExit('Missing saved lease proof')
          path=markers[0].parent
          proof=json.loads(markers[0].read_text())
          state=path/'data/cognitivecraft/leases/v1/state.jsonl'
          rows=[json.loads(line) for line in state.read_text().splitlines()]
          old=[r for r in rows[1:] if r['id']==proof['lease']]
          if len(old)!=1 or old[0]['state']!='INTERRUPTED' or rows[0]['epoch']==proof['epoch'] or any(r['state']=='ACTIVE' for r in rows[1:]):
              raise SystemExit('Restored leases admitted effects or lost old epoch fencing')
          if len(rows)>129 or state.stat().st_size>1048576: raise SystemExit('Lease storage exceeded declared bound')
          evidence=Path('core/build/lease-evidence')
          for source,name in [(root/'gametest-results.xml','leases-warm.xml'),(root/'logs/latest.log','leases-warm.log'),
                              (state,'leases-warm.jsonl'),(path/'lease-warm-evidence.json','physical-warm.json'),
                              (path/'data/cognitivecraft/jobs/v1/state.jsonl','physical-jobs.jsonl'),
                              (path/'data/cognitivecraft/citizens/v1/state.json','physical-citizens.json')]:
              shutil.copy2(source,evidence/name)
          result={'schema':1,'successfulMinecraftExecutions':2,'modelCalls':0,'physicalWheat':5,'cancelledCredit':2,
                  'succeededCredit':3,'leaseRecords':len(rows)-1,'snapshotBytes':state.stat().st_size,
                  'sha256':hashlib.sha256(state.read_bytes()).hexdigest()}
          (evidence/'physical-acceptance.json').write_text(json.dumps(result,indent=2)+'\n')
          print('IMP-012 saved-world acceptance '+json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lease-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core/build/test-results/
            fabric/build/test-results/
            core/build/lease-evidence/
            fabric/build/libs/
            fabric/build/gametest-run/gametest-results.xml
            fabric/build/gametest-run/logs/latest.log
