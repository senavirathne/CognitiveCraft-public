name: Rewrite public history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.head_commit.message == 'Prepare clean public history'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sanitized public tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rewrite main as a clean root commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan clean-main
          git add -Af
          git commit -m "Initial public CognitiveCraft snapshot"
          git push --force origin clean-main:main
