name: Parallel A grouped runtime and required regression qualification
on:
  push:
    branches: [impl/activity-runtime-recovery]
    paths:
      - '.github/workflows/parallel-a-runtime.yml'
      - '.github/parallel-a-run.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cc-runtime-a-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  a04-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Exact event and A04 ownership
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git merge-base --is-ancestor ea7de8000b2b484b885576c34ed5358274936ce9 HEAD
          python3 e2e/parallel_a/ownership.py
          python3 e2e/parallel_a/grouped_workflows.py --check
          python3 -m compileall -q e2e/parallel_a
          python3 -m unittest discover -s e2e/parallel_a -p 'test_*.py' -v
          python3 e2e/parallel_a/source_audit.py --out build/parallel-a/source-audit
      - name: Reproduce the acknowledged-owner race against the original reader
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A05 connected-world acknowledged-reader') }}
        run: |
          owner=core/src/main/java/dev/aivillages/core/kernel/KnowledgeAccessSource.java
          evidence=build/parallel-a/source-audit/a05-reader-race
          mkdir -p "$evidence"
          cp "$owner" "$evidence/candidate.java"
          trap 'cp "$evidence/candidate.java" "$owner"' EXIT
          git show e529671069bf8177e718419ea4dabad0b535d4db:"$owner" > "$owner"
          set +e
          bash gradlew --no-daemon :core:test --tests dev.aivillages.core.kernel.KnowledgeAccessAcknowledgedSourceTest > "$evidence/original-reader.log" 2>&1
          original_status=$?
          set -e
          cp core/build/test-results/test/TEST-dev.aivillages.core.kernel.KnowledgeAccessAcknowledgedSourceTest.xml "$evidence/original-reader.xml"
          cp "$evidence/candidate.java" "$owner"
          test "$original_status" -ne 0
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('build/parallel-a/source-audit/a05-reader-race/original-reader.xml')
          t=ET.parse(p).getroot()
          assert int(t.attrib['tests'])==3
          assert int(t.attrib['errors'])+int(t.attrib['failures'])>=2
          assert 'JobOutcomeSource$Stale' in p.read_text()
          print('A05_ORIGINAL_ACKNOWLEDGED_READER_RACE_REPRODUCED')
          PYCODE
          git diff --exit-code -- "$owner"
      - name: Reproduce stopped partial cancellation after restart against the original guard
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A06 receipt-prefix-native cancellation-restart') }}
        run: |
          owner=core/src/main/java/dev/aivillages/core/kernel/JobLifecycleStore.java
          evidence=build/parallel-a/source-audit/a06-cancellation-restart
          mkdir -p "$evidence"
          cp "$owner" "$evidence/candidate.java"
          trap 'cp "$evidence/candidate.java" "$owner"' EXIT
          git show 402d92a673f87e38d0de7a9a6e80c7ae14dcd8f5:"$owner" > "$owner"
          set +e
          bash gradlew --no-daemon :core:test --tests dev.aivillages.core.kernel.RecoveredJobOwnersTest.stoppedPartialAccountingUsesDurableCancellationAfterAnotherRestart > "$evidence/original-guard.log" 2>&1
          original_status=$?
          set -e
          cp core/build/test-results/test/TEST-dev.aivillages.core.kernel.RecoveredJobOwnersTest.xml "$evidence/original-guard.xml"
          cp "$evidence/candidate.java" "$owner"
          test "$original_status" -ne 0
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('build/parallel-a/source-audit/a06-cancellation-restart/original-guard.xml')
          t=ET.parse(p).getroot()
          assert int(t.attrib['tests'])==1
          assert int(t.attrib['failures'])==1 and int(t.attrib['errors'])==0
          assert 'stoppedPartialAccountingUsesDurableCancellationAfterAnotherRestart' in p.read_text()
          print('A06_ORIGINAL_CANCELLATION_RESTART_GUARD_FAILURE_REPRODUCED')
          PYCODE
          git diff --exit-code -- "$owner"
      - name: A04 closed-set history contracts and existing owner regressions
        run: |
          bash gradlew --no-daemon --continue --stacktrace :core:test :providers:test :fabric:test :fabric:build
          python3 -m unittest discover -s e2e -p 'test_*.py'
      - name: Compile exact native client and isolated A04 observers before activation
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 e2e/parallel_a/prepare.py
          python3 e2e/parallel_a/source_audit.py --out build/parallel-a/source-audit --native
      - name: Validate exact retained72-Job input without native effects
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A04 retained-world input') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/12763321061/zip > build/parallel-a/retained-native.zip
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'e2e/parallel_a')
          from qualified_checkpoint import read_checkpoint
          from finish_jobs import same_jar_entries
          value=read_checkpoint(Path('build/parallel-a/retained-native.zip'),Path('build/parallel-a/retained-input'))
          instrumentation=same_jar_entries(Path('build/parallel-a/retained-input/server/game/mods/observer.jar'),Path('build/e2e-driver/observer.jar'))
          result={'status':'PASS','nativeEffects':0,'retainedNativeDeliveries':len(value['cycles']),'retainedLogicalJobs':value['retainedLogicalJobs'],'retainedHotJobs':len(value['originalRows']),'worldFiles':len(value['worldHashes']),'instrumentationIdentity':instrumentation}
          Path('build/parallel-a/checkpoint-input-review.json').write_text(json.dumps(result,indent=2)+'\n')
          print('A04_RETAINED_CHECKPOINT_READ '+json.dumps(result))
          PY
      - name: Actual continuous-world A04 Job history and witnessed crash gates
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A04 connected-world') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_A04: >-
            ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A04 connected-world resume-') }}
          FINISH_QUALIFIED: >-
            ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A04 connected-world resume-qualified-1d437') }}
          RESUME_ARTIFACT: >-
            ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A04 connected-world resume-qualified-1d437') && '12763321061' || startsWith(github.event.head_commit.message, 'test(runtime-a): A04 connected-world resume-3dde') && '12735341658' || '12732465516' }}
        run: |
          python3 tools/needle/install.py build/needle
          if [ "$RESUME_A04" = true ]; then
            gh api repos/${{ github.repository }}/actions/artifacts/$RESUME_ARTIFACT/zip > build/parallel-a/prior-a04-native.zip
            if [ "$FINISH_QUALIFIED" = true ]; then
              python3 e2e/parallel_a/finish_jobs.py --root build/parallel-a/native --resume-archive build/parallel-a/prior-a04-native.zip
            else
              python3 e2e/parallel_a/jobs.py --root build/parallel-a/native --resume-archive build/parallel-a/prior-a04-native.zip
            fi
          else
            python3 e2e/parallel_a/jobs.py --root build/parallel-a/native
          fi
      - name: Actual A05 deposit evidence and independent native participant cuts
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A05 connected-world') || startsWith(github.event.head_commit.message, 'test(runtime-a): A05 preparation-profile') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_A05_SEED: >-
            ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A05 connected-world resume-reader-') || startsWith(github.event.head_commit.message, 'test(runtime-a): A05 preparation-profile') }}
          A05_PREPARATION_PROFILE: >-
            ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A05 preparation-profile') }}
          A05_PROFILE_FIRST: >-
            ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A05 connected-world resume-reader-b222 profile-first') }}
        run: |
          python3 tools/needle/install.py build/needle
          diagnostic_args=()
          if [ "$A05_PREPARATION_PROFILE" = true ]; then diagnostic_args+=(--profile-only); fi
          if [ "$A05_PROFILE_FIRST" = true ]; then diagnostic_args+=(--profile-first); fi
          if [ "$RESUME_A05_SEED" = true ]; then
            gh api repos/${{ github.repository }}/actions/artifacts/12808600136/zip > build/parallel-a/a05-prior-native.zip
            python3 e2e/parallel_a/deposits.py --root build/parallel-a/native-a05 --seed-archive build/parallel-a/a05-prior-native.zip "${diagnostic_args[@]}"
          else
            python3 e2e/parallel_a/deposits.py --root build/parallel-a/native-a05
          fi
      - name: A06 preliminary actual receipt retention and no false original-owner settlement
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A06 receipt-prefix-native') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/needle/install.py build/needle
          gh api repos/${{ github.repository }}/actions/artifacts/12808600136/zip > build/parallel-a/a06-prefix-seed.zip
          python3 e2e/parallel_a/receipt_prefix.py --root build/parallel-a/native-a06-prefix --seed-archive build/parallel-a/a06-prefix-seed.zip
      - name: A06 first native original-owner harvest and equal-state replacement refusal
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A06 harvest-native') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/needle/install.py build/needle
          gh api repos/${{ github.repository }}/actions/artifacts/12808600136/zip > build/parallel-a/a06-harvest-seed.zip
          python3 e2e/parallel_a/harvest_native.py --root build/parallel-a/native-a06-harvest --seed-archive build/parallel-a/a06-harvest-seed.zip
      - name: Independently review original and corrected A06 receipt-retention archives without native effects
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A06 receipt-prefix-review') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/parallel_a/review_receipt_prefix.py --run 40709069513 --source 402d92a673f87e38d0de7a9a6e80c7ae14dcd8f5 --expected-status FAIL --out build/parallel-a/a06-prefix-review-first --prepare-only
          python3 e2e/parallel_a/review_receipt_prefix.py --run 40710834698 --source 94ddf6764917963b6e5d1836dfceb153f93c6e9f --expected-status PASS_RECEIPT_RETENTION_ONLY_PENDING_INDEPENDENT_REVIEW --out build/parallel-a/a06-prefix-review-retry --prepare-only
          docker pull python:3.12-slim
          for cohort in first retry; do
            root="$PWD/build/parallel-a/a06-prefix-review-$cohort"
            if [ "$cohort" = first ]; then run=40709069513; source=402d92a673f87e38d0de7a9a6e80c7ae14dcd8f5; status=FAIL; else run=40710834698; source=94ddf6764917963b6e5d1836dfceb153f93c6e9f; status=PASS_RECEIPT_RETENTION_ONLY_PENDING_INDEPENDENT_REVIEW; fi
            docker run --rm --network none --user "$(id -u):$(id -g)" -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:$PWD:ro" -v "$root:$root:rw" -w "$PWD" python:3.12-slim python3 e2e/parallel_a/review_receipt_prefix.py --run "$run" --source "$source" --expected-status "$status" --input-manifest "$root/inputs.json" --out "$root/review"
          done
          mkdir -p build/parallel-a/source-audit/a06-prefix-review
          docker image inspect --format '{{.Id}}' python:3.12-slim > build/parallel-a/source-audit/a06-prefix-review/python-image-id.txt
          cp build/parallel-a/a06-prefix-review-first/review/review.json build/parallel-a/source-audit/a06-prefix-review/first.json
          cp build/parallel-a/a06-prefix-review-retry/review/review.json build/parallel-a/source-audit/a06-prefix-review/retry.json
      - name: Diagnostic CPU profile of exact retained A04 metadata
        if: >-
          ${{ startsWith(github.event.head_commit.message, 'test(runtime-a): A04 archive CPU profile') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/12729290176/zip > build/parallel-a/profile-source.zip
          python3 e2e/parallel_a/profile_metadata.py --archive build/parallel-a/profile-source.zip --root build/parallel-a/cpu-profile
      - name: Summarize separate post-failure native CPU recordings
        if: >-
          ${{ always() && startsWith(github.event.head_commit.message, 'test(runtime-a): A04 connected-world') }}
        run: python3 e2e/parallel_a/profile_native.py --root build/parallel-a/native
      - name: Retain contract results and exact built mod
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a04-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/parallel-a/source-audit/
            build/parallel-a/checkpoint-input-review.json
            build/parallel-a/observer-adaptation.json
            build/parallel-a/journal-probe/
            build/parallel-a/reference-log-self-test/
            build/parallel-a/cpu-profile/input-provenance.json
            build/parallel-a/cpu-profile/profile-result.json
            build/parallel-a/cpu-profile/profile-process.log
            build/parallel-a/cpu-profile/hot-stacks.json
            build/parallel-a/cpu-profile/metadata.jfr
            build/e2e-sdk/integrity.json
            build/e2e-driver/*.jar
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
      - name: Retain every A04 native frame reference, whole-world cohort and failed attempt
        if: >-
          ${{ always() && startsWith(github.event.head_commit.message, 'test(runtime-a): A04 connected-world') }}
        uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a04-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: build/parallel-a/native/
      - name: Retain every A05 native frame and independent crash cohort
        if: >-
          ${{ always() && startsWith(github.event.head_commit.message, 'test(runtime-a): A05 connected-world') }}
        uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a05-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: build/parallel-a/native-a05/
      - name: Retain A06 preliminary native receipt retention, original owners and all failed evidence
        if: >-
          ${{ always() && startsWith(github.event.head_commit.message, 'test(runtime-a): A06 receipt-prefix-native') }}
        uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a06-prefix-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: build/parallel-a/native-a06-prefix/
      - name: Retain first A06 native harvest, all raw worlds and every failed assertion
        if: >-
          ${{ always() && startsWith(github.event.head_commit.message, 'test(runtime-a): A06 harvest-native') }}
        uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a06-harvest-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: build/parallel-a/native-a06-harvest/
      - name: Retain separate A05 preparation diagnostics without an acceptance claim
        if: >-
          ${{ always() && startsWith(github.event.head_commit.message, 'test(runtime-a): A05 preparation-profile') }}
        uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a05-preparation-profile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: build/parallel-a/native-a05/

# BEGIN GENERATED REQUIRED REGRESSION JOBS
  # Required jobs from accomplishment-evidence.yml; source remains unchanged.
  required_accomplishment_evidence_acceptance:
    permissions:
      contents: read
    name: IMP-021 matrix, regressions and two-JVM GP-21
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Execute every attribution, storage and scheduling matrix case
        run: bash ./gradlew --no-daemon --stacktrace :core:test --tests dev.aivillages.core.kernel.AccomplishmentLedgerTest --tests dev.aivillages.core.kernel.AccomplishmentServiceTest
      - name: Require all 85 matrix cases to execute and pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for suite,count in [('AccomplishmentLedgerTest',79),('AccomplishmentServiceTest',6)]:
              cases=list(ET.parse(Path('core/build/test-results/test/TEST-dev.aivillages.core.kernel.'+suite+'.xml')).getroot().iter('testcase'))
              if len(cases)!=count or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
                  raise SystemExit('Every matrix case must execute and pass: '+suite)
          print('IMP-021 matrix: 85 executed passing cases')
          PY
      - name: Execute complete regressions and package runtime and native fixtures
        run: bash ./gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestJar
      - name: Select cold known-work evidence and a saved Minecraft witness
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');m=json.loads(p.read_text())
          m['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.AccomplishmentGameTests','dev.aivillages.fabric.ServerRestartProbeGameTests']
          p.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Execute actual Jobs and P0 receipts for two citizens without models
        timeout-minutes: 7
        env:
          COGNITIVECRAFT_ACCOMPLISHMENT_PHASE: cold
          COGNITIVECRAFT_RESTART_PROBE: cold
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Require active cold evidence and select the second JVM
        run: |
          python3 - <<'PY'
          import json,shutil,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('fabric/build/gametest-run');out=Path('fabric/build/accomplishment-evidence');out.mkdir(parents=True,exist_ok=True)
          cases=[c for c in ET.parse(root/'gametest-results.xml').getroot().iter('testcase') if c.get('name','').startswith('ai_villages_tests:')]
          if len(cases)!=2 or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):raise SystemExit('Two passing active cold project cases required')
          if 'IMP-021 GP-21 accepted phase=cold stock=5 quantity=5 completed=2 titles=2 modelCalls=0 noReplay=true' not in (root/'logs/latest.log').read_text():raise SystemExit('Active cold GP-21 proof missing')
          shutil.copy2(root/'gametest-results.xml',out/'cold.xml');shutil.copy2(root/'logs/latest.log',out/'cold.log')
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');m=json.loads(p.read_text())
          m['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.AccomplishmentRestartGameTests','dev.aivillages.fabric.ServerRestartProbeGameTests']
          p.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Reopen the same physical world, registry, Jobs and evidence without replay
        timeout-minutes: 7
        env:
          COGNITIVECRAFT_ACCOMPLISHMENT_PHASE: warm
          COGNITIVECRAFT_RESTART_PROBE: warm
        run: bash ./gradlew --no-daemon --stacktrace :fabric:runGameTest
      - name: Require warm proof, all tests, finite storage and clean release contents
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('fabric/build/gametest-run');out=Path('fabric/build/accomplishment-evidence')
          cases=[c for c in ET.parse(root/'gametest-results.xml').getroot().iter('testcase') if c.get('name','').startswith('ai_villages_tests:')]
          if len(cases)!=2 or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):raise SystemExit('Two passing active warm project cases required')
          if 'IMP-021 GP-21 accepted phase=warm stock=5 quantity=5 completed=2 titles=2 modelCalls=0 noReplay=true' not in (root/'logs/latest.log').read_text():raise SystemExit('Active warm GP-21 proof missing')
          shutil.copy2(root/'gametest-results.xml',out/'warm.xml');shutil.copy2(root/'logs/latest.log',out/'warm.log')
          saved=root/'world/cognitivecraft-accomplishment-fixture'
          cold=json.loads((saved/'cold.json').read_text());warm=json.loads((saved/'warm.json').read_text())
          for phase,proof in [('cold',cold),('warm',warm)]:
              if proof['phase']!=phase or proof['schema']!=1 or proof['architecture']!='0.5':raise SystemExit('Wrong native proof identity')
              if (proof['stock'],proof['quantity'],proof['completed'],proof['titles'],proof['modelCalls'],proof['progress'],proof['aggregates'])!=(5,5,2,2,0,4,3):raise SystemExit('Attribution, context or recognition mismatch')
              if not 0<proof['ledgerBytes']<=1048576 or not proof['ledgerBytes']<=proof['ownerBytes']<=3145728 or not 0<proof['sampleMaximum']<=4:raise SystemExit('Unbounded evidence storage')
          if cold['outcomes']!=warm['outcomes'] or cold['ledgerSha256']!=warm['ledgerSha256'] or cold['revision']!=warm['revision']:raise SystemExit('Reload/replay changed acknowledged evidence')
          if (cold['process'],cold['processStarted'])==(warm['process'],warm['processStarted']):raise SystemExit('Warm proof requires a separate JVM, including in reused PID namespaces')
          for name in ('cold.json','warm.json','restart.json'):shutil.copy2(saved/name,out/name)
          counts={}
          for module in ('core','providers','fabric'):
              cases=[c for p in Path(module+'/build/test-results/test').glob('TEST-*.xml') for c in ET.parse(p).getroot().iter('testcase')]
              if not cases or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):raise SystemExit('Complete executed module coverage required: '+module)
              counts[module]=len(cases)
          if sum(counts.values())<1239:raise SystemExit('Full current regression inventory required')
          jars=[p for p in Path('fabric/build/libs').glob('*.jar') if not any(s in p.name for s in ('sources','gametest','dev'))]
          if len(jars)!=1:raise SystemExit('Exactly one production artifact required')
          with zipfile.ZipFile(jars[0]) as jar:
