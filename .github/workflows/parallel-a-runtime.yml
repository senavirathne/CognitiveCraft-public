name: Parallel A runtime recovery qualification
on:
  push:
    branches: [impl/activity-runtime-recovery]
    paths:
      - '.github/workflows/parallel-a-runtime.yml'
      - 'e2e/parallel_a/**'
      - 'core/src/**'
      - 'fabric/src/**'
      - '**/build.gradle'
permissions:
  contents: read
concurrency:
  group: cc-runtime-a-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  a03-native-leases:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(runtime-a): split A03 evidence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Exact event and A03 lease ownership
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git merge-base --is-ancestor ea7de8000b2b484b885576c34ed5358274936ce9 HEAD
          python3 e2e/parallel_a/ownership.py
          python3 -m unittest discover -s e2e/parallel_a -p 'test_*.py' -v
          python3 e2e/parallel_a/source_audit.py --out build/parallel-a/source-audit
      - name: A03 lease archival contracts and unchanged baseline regressions
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 e2e/parallel_a/prepare.py
          python3 e2e/parallel_a/source_audit.py --out build/parallel-a/source-audit --native
          python3 tools/needle/install.py build/needle
      - name: Continuous native lease history, pinned original and actual publication crash cuts
        run: python3 e2e/parallel_a/leases.py --root build/parallel-a/native
      - name: Retain A03 native failures and exact-source history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a03-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/parallel-a/
            build/e2e-sdk/integrity.json
            build/e2e-driver/*.jar
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
  a03-artifact-review:
    if: >-
      ${{ startsWith(github.event.head_commit.message, 'chore(runtime-a): split A03 evidence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged qualified runtime and exact original artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          git diff --exit-code 013f2f412b194c8f95252c758dafd52b783de41e HEAD -- . ':(exclude).github/workflows/parallel-a-runtime.yml'
          mkdir -p build/parallel-a/review
          gh api repos/senavirathne/CognitiveCraft-public/actions/artifacts/12661370149/zip > build/parallel-a/review/original.zip
          python3 - <<'PYVERIFY'
          import hashlib,json,zipfile
          from pathlib import Path,PurePosixPath
          root=Path('build/parallel-a/review');original=root/'original.zip'
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for data in iter(lambda:f.read(1048576),b''):h.update(data)
              return h.hexdigest()
          expected='a7e57a9c0ba1b097aaf28e0ec9875ac3c645ea183789e67f6a3538e658e7daa1'
          assert original.stat().st_size==736210628 and sha(original)==expected
          with zipfile.ZipFile(original) as z:
              assert all(not PurePosixPath(n).is_absolute() and '..' not in PurePosixPath(n).parts for n in z.namelist())
              assert z.testzip() is None
              entries=len(z.infolist())
          parts=[]
          with original.open('rb') as f:
              for index in range(3):
                  part=root/('part-'+str(index).zfill(2)+'.bin');remaining=256*1024*1024
                  with part.open('wb') as out:
                      while remaining:
                          data=f.read(min(1048576,remaining))
                          if not data:break
                          out.write(data);remaining-=len(data)
                  parts.append({'name':part.name,'bytes':part.stat().st_size,'sha256':sha(part)})
              assert not f.read(1)
          assert sum(p['bytes'] for p in parts)==original.stat().st_size
          manifest={'schema':1,'source':'013f2f412b194c8f95252c758dafd52b783de41e','tree':'9d1a5186def6e8232030c2dcbe33f087040c9825',
                    'originalRun':40340328870,'originalArtifact':12661370149,'originalBytes':original.stat().st_size,'originalSha256':expected,
                    'archiveEntries':entries,'collectionIntegrity':'PASS','parts':parts,'nativeExecutionRepeated':False}
          (root/'A03-original-artifact-split-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('A03_ORIGINAL_ARCHIVE_VERIFIED '+json.dumps(manifest))
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a03-original-part-00-${{ github.sha }}-${{ github.run_id }}
          path: build/parallel-a/review/part-00.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a03-original-part-01-${{ github.sha }}-${{ github.run_id }}
          path: build/parallel-a/review/part-01.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a03-original-part-02-${{ github.sha }}-${{ github.run_id }}
          path: build/parallel-a/review/part-02.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cc-runtime-a-a03-original-manifest-${{ github.sha }}-${{ github.run_id }}
          path: build/parallel-a/review/A03-original-artifact-split-manifest.json
          if-no-files-found: error
          retention-days: 30
