name: Agent 1 Task 2 vertical log acquisition
on:
  pull_request:
    paths: ['.github/workflows/rb-vertical-logs.yml','e2e/vertical_logs.py','e2e/observer/**','scripts/verify-vertical-logs.py','fabric/src/gameTest/java/dev/aivillages/fabric/VerticalLogGameTests.java','fabric/src/main/java/dev/aivillages/fabric/FabricGatewayWorld.java']
  push:
    branches: [main,fix/rb-world-execution]
    paths: ['.github/workflows/rb-vertical-logs.yml','e2e/vertical_logs.py','e2e/observer/**','scripts/verify-vertical-logs.py','fabric/src/gameTest/java/dev/aivillages/fabric/VerticalLogGameTests.java','fabric/src/main/java/dev/aivillages/fabric/FabricGatewayWorld.java']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vertical-logs-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAVA_TOOL_OPTIONS: '-Dcognitivecraft.gametest.trace=true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: All module cases and exact production binary
        run: |
          bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build :fabric:gameTestClasses :fabric:gameTestJar
          python3 scripts/verify-rb001.py junit
          python3 scripts/verify-rb001.py identity
      - name: Independent actual vertical formations and safe physical boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');v=json.loads(p.read_text())
          v['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.VerticalLogGameTests']
          p.write_text(json.dumps(v,indent=2)+'\n')
          PY
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-vertical-logs.py native
          mv fabric/build/gametest-run fabric/build/vertical-formations-run
      - name: Original oak and birch physical regressions in a separate JVM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('fabric/src/gameTest/resources/fabric.mod.json');v=json.loads(p.read_text())
          v['entrypoints']['fabric-gametest']=['dev.aivillages.fabric.OakLogEffectGameTests','dev.aivillages.fabric.BirchLogEffectGameTests']
          p.write_text(json.dumps(v,indent=2)+'\n')
          PY
          bash gradlew --no-daemon --stacktrace :fabric:runGameTest
          python3 scripts/verify-vertical-logs.py existing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/rb001-evidence/
            build/vertical-evidence/
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/vertical-formations-run/
            fabric/build/gametest-run/
            fabric/build/libs/
  connected-vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Production binary, existing harness and actual client instruments
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:build
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 scripts/verify-rb001.py identity
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 tools/needle/install.py build/needle
      - name: Frozen A01 plus independent vertical, flat and birch regressions
        run: |
          python3 e2e/vertical_logs.py --root build/e2e/vertical
          python3 scripts/verify-vertical-logs.py client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-connected-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            build/rb001-evidence/
            build/e2e/vertical/
            build/e2e-sdk/integrity.json
            fabric/build/libs/ai-villages-0.1.0.jar
