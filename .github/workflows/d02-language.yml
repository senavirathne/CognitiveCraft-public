name: D02 plank transformation interpretation evidence
on:
  push:
    branches: [fix/nlu-planning-reliability, integration/all-branches-20261023]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d02-language-${{ github.ref }}
  cancel-in-progress: false
jobs:
  interpretation:
    name: Unit regressions and actual pinned Needle production measurement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Preserve all core and provider regressions
        run: bash gradlew --no-daemon --stacktrace :core:test :providers:test :providers:testClasses
      - name: Install immutable actual interpreter assets
        run: python3 tools/needle/install.py build/needle
      - name: Verify original D02 and independent production requests
        env:
          COGNITIVECRAFT_NEEDLE_DIR: ${{ github.workspace }}/build/needle
        run: bash gradlew --no-daemon --stacktrace :providers:runD02LanguageLiveProbe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d02-interpretation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/d02-evidence/
            build/needle/manifest.json
            core/build/test-results/test/
            providers/build/test-results/test/
  connected-client:
    name: Genuine original plank production and resource conservation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Production build and unchanged harness regressions
        run: |
          bash gradlew --no-daemon --stacktrace :fabric:test :fabric:build
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
          python3 scripts/verify-rb001.py identity
      - name: Acquire immutable existing language backend
        run: python3 tools/needle/install.py build/needle
      - name: Connected clients, original production, exact inputs, output and retained surplus
        run: python3 e2e/suite.py --profile d02 --root build/e2e/d02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d02-connected-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            build/rb001-evidence/identity.json
            build/e2e/d02/
            build/e2e-sdk/integrity.json
            fabric/build/test-results/test/
            fabric/build/libs/ai-villages-0.1.0.jar
