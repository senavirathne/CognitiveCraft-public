name: Capability retrieval acceptance
on:
  push:
    branches: [feature/imp010-capability-retrieval]
    paths: ['core/**', 'fabric/**', '.github/workflows/capability-retrieval.yml']
  pull_request:
    branches: [main, feature/default-nearest-world-references]
    paths: ['e2e/coverage.json', 'core/**', 'fabric/**', '.github/workflows/capability-retrieval.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cognitivecraft-retrieval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  retrieval:
    name: GP-12 bounded metadata / repository and resolver integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Core JUnit and Fabric composition build
        run: bash ./gradlew --no-daemon --stacktrace :core:test :fabric:build
      - name: Verify GP-12 execution, finite scale and XML checksums
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report=Path('core/build/test-results/test/TEST-dev.aivillages.core.kernel.CapabilityRetrievalIndexTest.xml')
          cases=list(ET.parse(report).getroot().iter('testcase'))
          if len(cases)<37 or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
              raise SystemExit('Expected at least 37 executed passing retrieval regressions')
          boundary={c.get('name','') for c in cases if c.get('name','').startswith('stablePagesHaveNoDuplicatesOrOmissionsAtBoundary(')}
          if boundary!={f'stablePagesHaveNoDuplicatesOrOmissionsAtBoundary({n})' for n in (0,1,16,17)}:
              raise SystemExit('All four explicit pagination boundary cases must execute')
          for name in ('stablePagesHaveNoDuplicatesOrOmissionsAtBoundary',
                       'fourThousandNinetySixRowsStayBoundedAndLookupLoadsNoBodies',
                       'runtimeRaceDuringExactFallbackCannotClaimCurrentPolicy',
                       'authoritativeRepositoryMetadataHasNoPrivateOriginsAndRuntimeEpochIsIndependent'):
              if not any(c.get('name','').startswith(name+'(') for c in cases):
                  raise SystemExit('Missing retrieval regression '+name)
          evidence=Path('core/build/retrieval-evidence')
          scale=json.loads((evidence/'scale.json').read_text())
          if (scale['entries']!=4096 or scale['metadataReads']!=4096 or scale['maximumRebuildBatch']>128
                  or scale['rebuildWork']!=8192 or scale['rebuildSlices']>70 or scale['lookupPages']!=256
                  or scale['lookupExamined']!=4096 or scale['cacheBytes']>4194304 or scale['bodyLoads']!=0):
              raise SystemExit('Retrieval scale limits or completeness failed: '+str(scale))
          digest=hashlib.sha256(); total=0
          for path in sorted(report.parent.glob('TEST-*.xml')):
              raw=path.read_bytes(); executed=list(ET.fromstring(raw).iter('testcase'))
              if any(c.find(t) is not None for c in executed for t in ('failure','error','skipped')):
                  raise SystemExit('Core case did not pass: '+str(path))
              total+=len(executed); digest.update(path.name.encode()); digest.update(raw)
          result={'schema':1,'retrievalCases':len(cases),'coreCases':total,
                  'retrievalXmlSha256':hashlib.sha256(report.read_bytes()).hexdigest(),
                  'coreXmlSha256':digest.hexdigest(),'scale':scale}
          (evidence/'acceptance.json').write_text(json.dumps(result,indent=2)+'\n')
          print('IMP-010 acceptance '+json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core/build/test-results/
            core/build/retrieval-evidence/
            fabric/build/libs/
