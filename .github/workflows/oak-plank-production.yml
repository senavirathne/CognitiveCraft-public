name: RB-002 oak-plank production acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['core/**','providers/**','fabric/**','e2e/**','scripts/**','.github/workflows/oak-plank-production.yml']
  push:
    branches: [main,rb-002-oak-plank-production]
    paths: ['core/**','providers/**','fabric/**','e2e/**','scripts/**','.github/workflows/oak-plank-production.yml']
permissions:
  contents: read
concurrency:
  group: rb002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  owners-and-native:
    name: RB-002 module and owner verification
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      JAVA_TOOL_OPTIONS: '-Dcognitivecraft.gametest.trace=true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Compile and run all modules against the pinned installed API
        run: bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:gameTestClasses :fabric:build :fabric:gameTestJar
      - name: Require every current scoped case to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          total=0
          for name,n in [('OakPlankProductionTest',8),('OakPlankGatewayTest',15),('TransformationReceiptTest',10),('OakPlankCompilerTest',4)]:
              p=Path('core/build/test-results/test/TEST-dev.aivillages.core.kernel.'+name+'.xml')
              cases=list(ET.parse(p).getroot().iter('testcase'))
              if len(cases)!=n or any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')):
                  raise SystemExit('All '+str(n)+' scoped cases must execute and pass: '+name)
              total+=len(cases)
          print('RB-002 initial owner matrix:',total,'passing cases; native/genuine/client gates are separate required work')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb002-owner-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
