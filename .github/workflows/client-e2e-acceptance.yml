name: Real Minecraft gameplay acceptance
on:
  push:
    branches: [main]
    paths: ['e2e/**', 'core/**', 'fabric/**', 'providers/**', 'tools/needle/**', 'scripts/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', 'gradlew', '.github/workflows/client-e2e-acceptance.yml']
  pull_request:
    paths: ['e2e/**', 'core/**', 'fabric/**', 'providers/**', 'tools/needle/**', 'scripts/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', 'gradlew', '.github/workflows/client-e2e-acceptance.yml']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: real-client-acceptance-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  genuine-acquisition:
    name: Tier 1 smoke and Tier 3 actual acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Production binary and existing unit boundaries
        run: bash gradlew --no-daemon --stacktrace :core:test :providers:test :fabric:test :fabric:build
      - name: Qualification must reject missing, skipped and mixed-layer evidence
        run: python3 -m unittest discover -s e2e -p 'test_*.py'
      - name: Verified official runtime and separate instrumentation
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
      - name: Select the committed arena only for identical production contents
        id: committed-arena
        if: hashFiles('e2e/environment/known-skill.zip') != ''
        run: python3 e2e/environment.py compatible >> "$GITHUB_OUTPUT"
      - name: Restore and replay the compatible committed genuine arena
        if: steps.committed-arena.outputs.compatible == 'true'
        run: |
          python3 e2e/environment.py restore
          python3 e2e/suite.py --profile environment --root build/e2e/committed-environment --seed build/e2e-restored-seed
      - name: First prove connected-player smoke
        run: python3 e2e/suite.py --profile smoke --root build/e2e/acceptance-smoke
      - name: Install genuine immutable Needle host assets
        run: python3 tools/needle/install.py build/needle
      - name: Measure host and execute fresh generation, trial, admission and offline reuse
        run: |
          mkdir -p build/e2e/acquire
          free -m > build/e2e/acquire/host-memory.txt
          lscpu > build/e2e/acquire/host-cpu.txt
          python3 e2e/suite.py --profile acquire --root build/e2e/acquire --seed build/e2e-certified-seed
          python3 e2e/environment.py pack --archive build/e2e-certified-environment.zip --manifest build/e2e-certified-environment.json --evidence-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Retain the certified stopped-world fixture and exact production binary
        uses: actions/upload-artifact@v4
        with:
          name: certified-known-skill-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          path: |
            build/e2e-certified-seed/
            build/e2e-certified-environment.zip
            build/e2e-certified-environment.json
            fabric/build/libs/ai-villages-0.1.0.jar
      - name: Preserve acquisition, packet, model and unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-gameplay-acquire-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          path: |
            build/e2e/acceptance-smoke/
            build/e2e/acquire/
            build/e2e/committed-environment/
            build/e2e-sdk/integrity.json
            core/build/test-results/test/
            providers/build/test-results/test/
            fabric/build/test-results/test/
            fabric/build/test-runtime/
      - name: Print diagnostic summary
        if: failure()
        run: python3 e2e/diagnostics.py build/e2e/acceptance-smoke build/e2e/acquire
  gameplay:
    name: ${{ matrix.profile }} connected-player acceptance
    needs: genuine-acquisition
    strategy:
      fail-fast: false
      matrix:
        profile: [deterministic, nlu, resilience]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - uses: actions/download-artifact@v4
        with:
          name: certified-known-skill-${{ github.run_id }}
          path: .
      - name: Verify dependencies and build isolated drivers against the certified binary
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
      - name: Install real Needle only for NLU
        if: matrix.profile == 'nlu'
        run: python3 tools/needle/install.py build/needle
      - name: Execute the selected tier without a generation backend
        run: python3 e2e/suite.py --profile ${{ matrix.profile }} --root build/e2e/${{ matrix.profile }} --seed build/e2e-certified-seed
      - name: Preserve all lifecycle, world, packet, assertion and JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-gameplay-${{ matrix.profile }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          path: build/e2e/${{ matrix.profile }}/
      - name: Print diagnostic summary
        if: failure()
        run: python3 e2e/diagnostics.py build/e2e/${{ matrix.profile }}
  qualification:
    name: Require all 13 families and exact-layer IMP-001–019 evidence
    needs: [genuine-acquisition, gameplay]
    if: always()
    outputs:
      qualification-artifact-id: ${{ steps.qualification-artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: real-gameplay-*
          path: build/qualification
      - name: Require independently executed exact-head owner and live planning gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 e2e/owner_evidence.py build/qualification --head "$REVIEWED_HEAD"
      - name: Merge observed results, never count absent cases as passing
        if: always()
        run: python3 e2e/qualify.py build/qualification
      - uses: actions/upload-artifact@v4
        id: qualification-artifact
        if: always()
        with:
          name: real-gameplay-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/qualification/qualification.json
            build/qualification/owner-evidence.json
            build/qualification/production-fix-validation.json
  rb-qualification:
    name: Require all nine RB units with the shared real-client procedure
    needs: qualification
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.qualification.outputs.qualification-artifact-id }}
          merge-multiple: true
          path: build/rb-series/baseline
      - name: Require the selected baseline envelope before waiting for RB owners
        run: test -f build/rb-series/baseline/qualification.json
      - name: Collect exact-head resource owners, retain original artifact identities and qualify each layer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEWED_EVENT: ${{ github.event_name }}
        run: python3 e2e/rb_qualify.py build/rb-series --head "$REVIEWED_HEAD" --event "$REVIEWED_EVENT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rb-series-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/rb-series/rb-series-qualification.json
            build/rb-series/rb-owner-evidence.json
            build/rb-series/captures/
