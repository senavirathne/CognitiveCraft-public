name: C final cumulative qualification
on:
  push:
    branches: [feature/player-assisted-dialogue]
    paths: [e2e/parallel_c/qualification-request.json]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit final qualification request
        id: request
        run: |
          python3 e2e/parallel_c/qualification_request.py e2e/parallel_c/qualification-request.json
          python3 - <<'PY'
          import json,os
          value=json.load(open('e2e/parallel_c/qualification-request.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('docs_sha='+value['docs_candidate_sha']+'\n')
          PY
      - name: Require authorized private documentation checkout
        env:
          DOCS_TOKEN: ${{ secrets.COGNITIVECRAFT_DOCS_READ_TOKEN }}
        run: test -n "$DOCS_TOKEN" || { echo 'Missing authorized docs-repository read credential; see C00 handoff.'; exit 2; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: senavirathne/CognitiveCraft-Documentation
          ref: ${{ steps.request.outputs.docs_sha }}
          token: ${{ secrets.COGNITIVECRAFT_DOCS_READ_TOKEN }}
          path: build/CognitiveCraft-Documentation-C
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
          key: minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Measure exact unchanged B baseline
        run: |
          git worktree add --detach build/parallel-c-baseline-source 12fb3af99e0c9496171b89d4dd2ffff3f5c7a824
          python3 e2e/parallel_c/build.py --repo build/parallel-c-baseline-source --output build/e2e/parallel-c/baseline
      - name: Build one production candidate and capture all module XML
        run: python3 e2e/parallel_c/build.py --output build/e2e/parallel-c/candidate
      - name: Reuse exact installed SDK and compile existing isolated drivers
        run: |
          python3 e2e/runtime.py prepare
          python3 e2e/runtime.py compile
      - name: Collect cumulative owned unit Python native and client schedules
        run: python3 e2e/parallel_c/stage.py run --stage C08 --built --root build/e2e/parallel-c/C08 --docs-root build/CognitiveCraft-Documentation-C
      - name: Independent final oracle
        run: |
          python3 e2e/parallel_c/verify.py --stage C08 --root build/e2e/parallel-c/C08 --source "$(git rev-parse HEAD)" --tree "$(git rev-parse 'HEAD^{tree}')" --jar fabric/build/libs/ai-villages-0.1.0.jar --docs-root build/CognitiveCraft-Documentation-C --output build/e2e/parallel-c/C08/qualified.json
      - name: Publish raw and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parallel-c-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/e2e/parallel-c/
            core/build/test-results/
            providers/build/test-results/
            fabric/build/test-results/
            build/e2e-sdk/integrity.json
