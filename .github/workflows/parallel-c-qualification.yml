name: C cumulative Docker qualification
on:
  push:
    branches: [feature/player-assisted-dialogue]
    paths: [e2e/parallel_c/qualification-request.json]
permissions:
  contents: read
concurrency:
  group: parallel-c-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate one explicit cumulative request
        id: request
        run: |
          python3 e2e/parallel_c/qualification_request.py e2e/parallel_c/qualification-request.json
          python3 - <<'PY'
          import json,os
          value=json.load(open('e2e/parallel_c/qualification-request.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('docs_sha='+value['docs_candidate_sha']+'\n')
          PY
      - name: Discover optional direct documentation checkout credential
        id: docs-access
        env:
          DOCS_TOKEN: ${{ secrets.COGNITIVECRAFT_DOCS_READ_TOKEN }}
        run: |
          if test -n "$DOCS_TOKEN"; then
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
            echo 'Direct docs credential unavailable. Restore the exact verified sparse Git snapshot and execute every gate.'
          fi
      - name: Checkout exact private docs when authorized
        id: docs
        if: steps.docs-access.outputs.available == 'true'
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: senavirathne/CognitiveCraft-Documentation
          ref: ${{ steps.request.outputs.docs_sha }}
          token: ${{ secrets.COGNITIVECRAFT_DOCS_READ_TOKEN }}
          path: build/CognitiveCraft-Documentation-C
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact sparse docs Git objects when direct checkout is unavailable
        if: steps.docs.outcome != 'success'
        run: |
          python3 e2e/parallel_c/materialize_docs.py --root build/CognitiveCraft-Documentation-C --expected-sha '${{ steps.request.outputs.docs_sha }}' --output build/e2e/parallel-c/docs-input.json
      - name: Restore verified SDK Gradle model and Docker image caches
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
            build/parallel-c-cache
          key: parallel-c-docker-linux-v3-${{ hashFiles('scripts/dependencies.json', 'gradle/wrapper/gradle-wrapper.properties', 'e2e/runtime.py', 'e2e/Dockerfile', 'e2e/parallel_c/ci/Dockerfile', 'e2e/parallel_c/ci/ModelDockerfile', 'e2e/parallel_c/ci/model-lock.json') }}
          restore-keys: |
            parallel-c-docker-linux-v3-
            parallel-c-docker-linux-v2-
            minecraft-client-26.3-702fe591-fabric-0195-linux-v1
      - name: Start healthy model backend and run every cumulative gate in Docker
        env:
          COGNITIVECRAFT_C_MODEL_URL: ${{ vars.COGNITIVECRAFT_C_MODEL_URL }}
          COGNITIVECRAFT_C_MODEL_ALIAS: ${{ vars.COGNITIVECRAFT_C_MODEL_ALIAS }}
          COGNITIVECRAFT_C_MODEL_SHA256: ${{ vars.COGNITIVECRAFT_C_MODEL_SHA256 }}
          COGNITIVECRAFT_C_MODEL_FILE: ${{ vars.COGNITIVECRAFT_C_MODEL_FILE }}
          COGNITIVECRAFT_C_MODEL_SERVER_PATH: ${{ vars.COGNITIVECRAFT_C_MODEL_SERVER_PATH }}
          COGNITIVECRAFT_C_MODEL_BUILD: ${{ vars.COGNITIVECRAFT_C_MODEL_BUILD }}
        run: python3 e2e/parallel_c/ci_host.py
      - name: Retain reusable caches after successful or partial execution
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/e2e-sdk
            build/server-sdk
            build/parallel-c-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Print bounded container result
        if: always()
        run: |
          if test -f build/e2e/parallel-c/container.log; then tail -n 70 build/e2e/parallel-c/container.log; fi
      - name: Publish all raw and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parallel-c-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/e2e/parallel-c/
            core/build/test-results/
            providers/build/test-results/
            fabric/build/test-results/
            fabric/build/libs/
            build/e2e-driver/
            build/e2e-sdk/integrity.json
