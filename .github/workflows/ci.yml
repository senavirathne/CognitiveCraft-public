name: A10 retained failure diagnostics
on:
  push:
    branches: [diagnostic/a10-batch66]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    name: Read complete retained failures in network-denied Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile diagnostic parser without executing native work
        run: python3 -m py_compile a10_diagnostics.py
      - name: Fetch immutable offline analysis image
        run: docker pull mcr.microsoft.com/playwright/python@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      - name: Fully verify all failed native archives, export retained JFR and analyse offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 a10_diagnostics.py run --out build/a10-retained-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a10-batch66-retained-failure-diagnosis-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: build/a10-retained-diagnostics/
