name: RB-002 installed recipe API inspection
on:
  push:
    branches: [rb-002-oak-plank-production]
    paths: [.github/workflows/rb002-api-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Prepare the pinned installed Minecraft API in Actions
        run: bash gradlew --no-daemon --stacktrace :fabric:compileJava
      - name: Inspect installed recipe and custody API signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,zipfile
          roots=[Path('.gradle'),Path(os.environ['GRADLE_USER_HOME'])/'caches'/'fabric-loom']
          names=['net.minecraft.world.item.crafting.Recipe','net.minecraft.world.item.crafting.CraftingRecipe','net.minecraft.world.item.crafting.ShapelessRecipe','net.minecraft.world.item.crafting.CraftingInput','net.minecraft.world.item.crafting.RecipeManager','net.minecraft.world.item.ItemStack','net.minecraft.world.item.ItemStackTemplate','net.minecraft.world.SimpleContainer']
          candidates=[]
          for root in roots:
              if root.exists():
                  for jar in root.rglob('*.jar'):
                      try:
                          with zipfile.ZipFile(jar) as z:
                              if 'net/minecraft/world/item/crafting/Recipe.class' in z.namelist():candidates.append(jar)
                      except zipfile.BadZipFile:pass
          if not candidates:raise SystemExit('Installed official class archive not found')
          jar=max(candidates,key=lambda p:p.stat().st_size)
          result=subprocess.run(['javap','-public','-classpath',str(jar),*names],text=True,capture_output=True,check=True)
          Path('recipe-api.txt').write_text(result.stdout)
          print(result.stdout)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rb002-recipe-api
          path: recipe-api.txt
