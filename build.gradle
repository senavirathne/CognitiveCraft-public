plugins { id 'base'; id 'net.fabricmc.fabric-loom' version '1.18.1' apply false }
allprojects {
    group = 'dev.aivillages'
    version = '0.1.0'
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
    tasks.withType(Test).configureEach { useJUnitPlatform(); testLogging { events 'failed', 'skipped' } }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
